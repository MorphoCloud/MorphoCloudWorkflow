name: Close Expired Issues

# Close instance issues whose lifespan has ended AND whose resources are
# confirmed gone (#293). This is the only place issues are closed at end of
# life; automatic-instance-deleting.yml deletes resources but never closes.
#
# Two rules, deliberately:
#  - Close at expiry, not at deletion: an issue emptied early via /delete_all
#    stays open and reusable via /create until its own deadline — the Layer 1
#    quota counts open issues and tells users to reuse them.
#  - Close on confirmed absence, not on dispatch: a failed delete leaves the
#    resources in place, so the issue stays open with the failure visible.
#
# Runs at noon UTC, ~12 hours after the deletion sweep fires (midnight UTC,
# via the runner-1 crontab dispatch), so in-flight deletes settle before
# absence is checked.
#
# Also closes workshop parent issues once all their sub-issues are closed.
# That rollup lives here (not in the deletion sweep) so it fires regardless
# of which path closed the sub-issues.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ vars.MORPHOCLOUD_OS_CLOUD }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  close-expired:
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Close expired issues with no remaining resources
        shell: bash
        run: |
          source ~/venv/bin/activate

          instance_prefix=${PREFIX:+${PREFIX}_}

          # One snapshot each of servers and volumes; every issue is checked
          # against these lists instead of hitting the OpenStack API per issue.
          # The snapshots are guarded: an OpenStack failure must abort the
          # sweep, not read as an empty list — "no resources" is exactly the
          # condition that authorizes a close.
          if ! server_list_json=$(openstack server list --name "^${instance_prefix}instance-\\d+" -f json); then
            echo "::error ::openstack server list failed; aborting sweep"
            exit 1
          fi
          if ! volume_list_json=$(openstack volume list -f json); then
            echo "::error ::openstack volume list failed; aborting sweep"
            exit 1
          fi
          server_names=$(echo "$server_list_json" | jq -r '.[].Name')
          volume_names=$(echo "$volume_list_json" | jq -r '.[].Name')

          current_time_epoch=$(date +%s)

          # instance-request marks all closable issue types: individual, course
          # and workshop sub-issues. Workshop parent issues do not carry it and
          # are handled by the rollup below.
          gh issue list --label "instance-request" --state open --limit 500 --json number,createdAt,labels | \
          jq -c '.[]' | while read -r issue_json; do
            issue_number=$(echo "$issue_json" | jq -r '.number')
            created_at=$(echo "$issue_json" | jq -r '.createdAt')
            labels=$(echo "$issue_json" | jq -r '.labels[].name')

            # Same expiration-ladder math as automatic-instance-deleting.yml:
            # sorted expiration:* rungs, indexed by renewed:N. The || true
            # keeps a label-less issue from killing the loop (this step runs
            # with pipefail, unlike the deletion sweep).
            lifespan_list=$(echo "$labels" | grep -oP '(?<=expiration:)\d+(\.\d+)?' | sort -n || true)
            if [[ -z "$lifespan_list" ]]; then
              echo "Skipping issue #${issue_number}: no 'expiration' labels."
              continue
            fi

            renewed_count=$(echo "$labels" | grep -oP '(?<=renewed:)\d+' | sort -nr | head -n1 || true)
            renewed_count=${renewed_count:-0}

            expiration_days=$(echo "$lifespan_list" | sed -n "$((renewed_count + 1))p")
            expiration_days=${expiration_days:-0}

            created_at_epoch=$(date -d "$created_at" +%s)
            expiration_time_epoch=$(printf "%.0f" $(echo "$created_at_epoch + $expiration_days * 86400" | bc))
            seconds_until_expiration=$((expiration_time_epoch - current_time_epoch))

            if [[ "$seconds_until_expiration" -gt 0 ]]; then
              echo "Skipping issue #${issue_number}: expires in $((seconds_until_expiration / 86400)) day(s)."
              continue
            fi

            # Expired — close only if both resources are confirmed absent.
            instance_name="${instance_prefix}instance-${issue_number}"
            if echo "$server_names" | grep -qFx "$instance_name"; then
              echo "Skipping issue #${issue_number}: expired but server ${instance_name} still exists (deletion pending or failed)."
              continue
            fi

            # Suffix-aware match (same pattern as guard-issue-close.yml): any
            # volume for this issue number holds the issue open, including
            # volumes in the automatic-volume-deleting.yml grace window.
            if echo "$volume_names" | grep -qE "^My-Data-${issue_number}(-.*)?$"; then
              echo "Skipping issue #${issue_number}: expired but a My-Data-${issue_number} volume still exists (grace period or failed delete)."
              continue
            fi

            echo "Closing issue #${issue_number}: expired ${expiration_days}d after creation, no resources remain."
            gh issue close "$issue_number" --comment "This instance request has reached the end of its lifespan and its resources have been released. To start a new instance, [open a new request](https://github.com/${GH_REPO}/issues/new/choose)."
          done
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}

      - name: Close workshop parent issues whose sub-issues are all closed
        shell: bash
        run: |
          gh issue list --label "request-type:workshop" --state open --limit 500 --json number --jq '.[].number' | \
          while read -r workshop_issue_number; do
            # No fallback on failure: a mid-pagination error would leave
            # partial pages on stdout, and counting them could close a parent
            # whose unseen sub-issues are still open. Let the step fail loudly
            # instead; a workshop with no sub-issues returns [] successfully.
            sub_issues_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GH_REPO/issues/$workshop_issue_number/sub_issues" \
              --paginate \
              --jq '[.[].state]')

            # --paginate emits one array per page; slurp+flatten makes the
            # counts correct for workshops larger than one page (100).
            total_sub_issues=$(echo "$sub_issues_json" | jq -s 'flatten | length')
            open_sub_issues=$(echo "$sub_issues_json" | jq -s 'flatten | map(select(. == "open")) | length')

            # total > 0 guards the vacuous case: a workshop whose sub-issues
            # have not been created yet must not be closed.
            if [[ "$total_sub_issues" -gt 0 && "$open_sub_issues" -eq 0 ]]; then
              echo "Closing workshop issue #${workshop_issue_number}: all ${total_sub_issues} sub-issue(s) closed."
              gh issue close "$workshop_issue_number" --comment "All workshop instances have expired and been deleted. Closing workshop issue."
            else
              echo "Skipping workshop issue #${workshop_issue_number}: ${open_sub_issues}/${total_sub_issues} sub-issue(s) still open."
            fi
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
