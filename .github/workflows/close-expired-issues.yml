name: Instance End of Life

# The single owner of the instance-request end-of-life contract (#293):
#
#   - Warnings key on ISSUE age, server or no server: renewal-notice at
#     <=7 days and <=1 day, with /renew as the escape hatch.
#   - At expiry: delete the server if one exists (in ANY state — active,
#     shelved, errored, half-built), delete every My-Data volume left for
#     the issue (attached, in the deletion grace window, or orphaned by a
#     failed /create), then close once a FRESH OpenStack query confirms
#     both gone. A failed delete keeps the issue open with the failure
#     visible — never papered over by a close.
#   - Nothing left at expiry (never /create'd, or released early)? Close.
#   - Resource deletion also covers issues already closed by their user:
#     closing an issue never exempts its resources from expiration (see
#     guard-issue-close.yml).
#
# This replaces automatic-instance-deleting.yml (retired). That sweep
# iterated `openstack server list`, so an issue whose server was gone —
# released early, or /create failed after building only the volume
# (Instances#129/#130) — was never visited again: no warnings, orphaned
# volumes kept forever, and the issue never closed.
#
# The noon UTC schedule is a backstop; the runner-1 crontab dispatches the
# authoritative midnight UTC run (same dispatch mechanism as the retired
# deletion sweep).

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ vars.MORPHOCLOUD_OS_CLOUD }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  end-of-life:
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Warn, delete, and close expired requests
        shell: bash
        run: |
          source ~/venv/bin/activate

          instance_prefix=${PREFIX:+${PREFIX}_}

          # Guarded snapshots: an OpenStack failure must abort the sweep, not
          # read as an empty list — "no resources" is exactly the condition
          # that authorizes deletion and closing.
          if ! server_list_json=$(openstack server list --name "^${instance_prefix}instance-\\d+" -f json); then
            echo "::error ::openstack server list failed; aborting sweep"
            exit 1
          fi
          if ! volume_list_json=$(openstack volume list -f json); then
            echo "::error ::openstack volume list failed; aborting sweep"
            exit 1
          fi
          server_names=$(echo "$server_list_json" | jq -r '.[].Name')

          current_time_epoch=$(date +%s)

          # Expired OPEN issues whose resources are gone or being deleted;
          # the confirm-and-close phase below closes each one after a fresh
          # query proves absence. Format: <issue_number>:<expiration_days>
          candidates_file=$(mktemp)

          # instance-request marks every per-instance issue type: individual,
          # course, and workshop sub-issues (workshop parents are handled by
          # the rollup step). --state all: warnings and closes apply to open
          # issues only, but resource deletion must also reach issues their
          # user closed early.
          gh issue list --label "instance-request" --state all --limit 1000 --json number,state,createdAt,labels | \
          jq -c '.[]' | while read -r issue_json; do
            issue_number=$(echo "$issue_json" | jq -r '.number')
            issue_state=$(echo "$issue_json" | jq -r '.state')
            created_at=$(echo "$issue_json" | jq -r '.createdAt')
            labels=$(echo "$issue_json" | jq -r '.labels[].name')

            # Expiration ladder: sorted expiration:* rungs, indexed by
            # renewed:N. (|| true: label-less issues must not kill the loop
            # under pipefail.)
            lifespan_list=$(echo "$labels" | grep -oP '(?<=expiration:)\d+(\.\d+)?' | sort -n || true)
            if [[ -z "$lifespan_list" ]]; then
              echo "Skipping issue #${issue_number}: no 'expiration' labels."
              continue
            fi

            renewed_count=$(echo "$labels" | grep -oP '(?<=renewed:)\d+' | sort -nr | head -n1 || true)
            renewed_count=${renewed_count:-0}

            expiration_days=$(echo "$lifespan_list" | sed -n "$((renewed_count + 1))p")
            expiration_days=${expiration_days:-0}

            created_at_epoch=$(date -d "$created_at" +%s)
            expiration_time_epoch=$(printf "%.0f" $(echo "$created_at_epoch + $expiration_days * 86400" | bc))
            seconds_until_expiration=$((expiration_time_epoch - current_time_epoch))
            days_until_expiration=$((seconds_until_expiration / 86400))

            instance_name="${instance_prefix}instance-${issue_number}"

            if [[ "$seconds_until_expiration" -gt 0 ]]; then
              # ---- Still within lifespan: warning window (open issues only).
              if [[ "$issue_state" != "OPEN" ]]; then
                continue
              fi
              if [[ "$days_until_expiration" -le $EXPIRATION_WARNING_DAYS ]]; then
                # Course instances are not renewable: fixed duration set at
                # intake. COURSE_TEAM_SLUG is set only in MC-* repos.
                if [[ -n "$COURSE_TEAM_SLUG" ]]; then
                  echo "Skipping renewal warning for issue #${issue_number} (course instances are not renewable)"
                # Workshop instances (expiration <= 7 days) are temporary and
                # not meant to be renewed.
                elif (( $(echo "$expiration_days <= 7" | bc -l) )); then
                  echo "Skipping renewal warning for issue #${issue_number} (workshop instance, expires in ${expiration_days} days)"
                else
                  # At most two notices per cycle: one when the window opens,
                  # one the day before deletion. Labels make each fire once
                  # and are cleared below when a renewal moves the issue back
                  # out of the window.
                  if [[ "$days_until_expiration" -le $FINAL_WARNING_DAYS ]]; then
                    notice_label="renewal-notice:last"
                  else
                    notice_label="renewal-notice:first"
                  fi
                  if echo "$labels" | grep -qx "$notice_label"; then
                    echo "Renewal notice ${notice_label} already sent for issue #${issue_number} (${days_until_expiration} days left); skipping."
                  else
                    echo "Issue #${issue_number} expires in ${days_until_expiration} day(s). Sending warning (${notice_label})..."
                    # Only suggest /renew when a higher rung of the ladder
                    # actually remains.
                    expiration_count=$(echo "$lifespan_list" | grep -c . || true)
                    if [[ "$expiration_count" -gt $((renewed_count + 1)) ]]; then
                      renew_hint='Comment `/renew` to extend.'
                    else
                      renew_hint='No renewals remain.'
                    fi
                    gh issue comment "$issue_number" \
                      --body '⚠️ Instance and volume will be deleted in '"$days_until_expiration"' days. '"$renew_hint"
                    set +e
                    gh workflow run send-renewal-email.yml \
                      -f issue_number=$issue_number \
                      -f days_until_expiration=$days_until_expiration
                    error_code=$?
                    set -e
                    if [[ $error_code -ne 0 ]]; then
                      echo "::warning ::Failed to dispatch renewal email for issue #${issue_number}"
                      gh issue comment "$issue_number" \
                        --body "❌ Failed to send renewal email. See details at ${RUN_URL}"
                      continue
                    fi
                    gh issue edit "$issue_number" --add-label "$notice_label" || true
                  fi
                fi
              else
                # Outside the window (freshly created or renewed back out):
                # drop notice labels from a previous cycle so the next cycle
                # warns again.
                for n in first last; do
                  if echo "$labels" | grep -qx "renewal-notice:$n"; then
                    gh issue edit "$issue_number" --remove-label "renewal-notice:$n" || true
                  fi
                done
              fi
              continue
            fi

            # ---- Expired: delete whatever exists, in whatever state.
            server_exists=false
            if echo "$server_names" | grep -qFx "$instance_name"; then
              server_exists=true
            fi
            # Suffix-aware: every volume for this issue number, including
            # grace-window survivors and failed-create orphans.
            matching_volumes=$(echo "$volume_list_json" | jq -c --arg re "^My-Data-${issue_number}(-.*)?$" '[.[] | select(.Name | test($re))]')
            volume_count=$(echo "$matching_volumes" | jq 'length')

            if [[ "$server_exists" == "false" && "$volume_count" -eq 0 ]]; then
              # Nothing left — close (if open) after the fresh-query confirm.
              if [[ "$issue_state" == "OPEN" ]]; then
                echo "Issue #${issue_number} expired with no resources; queued for close."
                echo "${issue_number}:${expiration_days}" >> "$candidates_file"
              fi
              continue
            fi

            echo "Issue #${issue_number} has expired (server: ${server_exists}, volumes: ${volume_count}). Deleting resources..."
            if [[ "$server_exists" == "true" ]]; then
              # The user reads why before the mechanical deletion comments.
              gh issue comment "$issue_number" \
                --body "Instance **${instance_name}** has expired. The instance and its associated volume are being deleted." || true
            else
              gh issue comment "$issue_number" \
                --body "This request has expired. Deleting the leftover **My-Data-${issue_number}** volume." || true
            fi

            # Volumes first (detaching from the instance when needed), then
            # the instance — same order as the retired deletion sweep.
            if [[ "$volume_count" -gt 0 ]]; then
              instance_id=$(echo "$server_list_json" | jq -r --arg n "$instance_name" '.[] | select(.Name == $n) | .ID' | tail -1)
              echo "$matching_volumes" | jq -c '.[]' | while read -r vol; do
                volume_id=$(echo "$vol" | jq -r '.ID')
                volume_name=$(echo "$vol" | jq -r '.Name')
                if [[ -n "$instance_id" ]]; then
                  # || echo false: the server can vanish between snapshot and
                  # here (concurrent /delete_all); treat that as detached
                  # rather than killing the loop under pipefail.
                  is_attached=$(openstack server show "$instance_id" -f json 2>/dev/null | \
                    jq --arg volume_id "$volume_id" \
                    '[.volumes_attached[]?.id] | index($volume_id) != null' || echo "false")
                  if [[ "$is_attached" == "true" ]]; then
                    echo "Detaching volume ${volume_name} from ${instance_name}..."
                    if openstack server remove volume "$instance_id" "$volume_id"; then
                      echo "Waiting 60 seconds for volume to become available..."
                      sleep 60
                    else
                      echo "::warning ::Failed to detach volume ${volume_name} from ${instance_name}"
                    fi
                  fi
                fi
                echo "Deleting volume ${volume_name}..."
                if openstack volume delete "$volume_id"; then
                  echo "Volume ${volume_name} deleted successfully"
                  gh issue edit "$issue_number" --add-label "volume:deleted" --remove-label "volume:expiration-pending" || true
                  gh issue comment "$issue_number" --body "Volume **${volume_name}** successfully deleted ✅"
                else
                  echo "::warning ::Failed to delete volume ${volume_name}"
                  gh issue comment "$issue_number" --body "❌ Failed to delete volume **${volume_name}**. See details at ${RUN_URL}"
                fi
              done
            fi

            if [[ "$server_exists" == "true" ]]; then
              set +e
              gh workflow run control-instance-from-workflow.yml \
                -f issue_number=$issue_number \
                -f command_name=delete \
                -f unapprove_after_delete=true
              error_code=$?
              set -e
              if [[ $error_code -ne 0 ]]; then
                echo "::warning ::Failed to dispatch the delete workflow for ${instance_name}"
                gh issue comment "$issue_number" \
                  --body "❌ Failed to delete instance. See details at ${RUN_URL}"
                # Not a close candidate: the server is still there. Retried
                # on the next run.
                continue
              fi
            fi

            if [[ "$issue_state" == "OPEN" ]]; then
              echo "${issue_number}:${expiration_days}" >> "$candidates_file"
            fi
          done

          # ---- Confirm and close.
          # The instance delete above is asynchronous (dispatched workflow),
          # so close only what a fresh OpenStack query confirms gone; poll up
          # to the deadline for deletions still in flight. Anything still
          # present at the deadline stays open — with the deletion comments
          # visible — and is retried by the next run.
          if [[ ! -s "$candidates_file" ]]; then
            echo "No issues to close this run."
            exit 0
          fi
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            if ! round_servers=$(openstack server list --name "^${instance_prefix}instance-\\d+" -f json | jq -r '.[].Name'); then
              echo "::warning ::server list failed during confirm phase; retrying"
              sleep 30
              if (( $(date +%s) >= deadline )); then break; fi
              continue
            fi
            if ! round_volumes=$(openstack volume list -f json | jq -r '.[].Name'); then
              echo "::warning ::volume list failed during confirm phase; retrying"
              sleep 30
              if (( $(date +%s) >= deadline )); then break; fi
              continue
            fi

            remaining_file=$(mktemp)
            while IFS=: read -r n exp_days; do
              still_there=false
              if echo "$round_servers" | grep -qFx "${instance_prefix}instance-${n}"; then
                still_there=true
              fi
              if echo "$round_volumes" | grep -qE "^My-Data-${n}(-.*)?$"; then
                still_there=true
              fi
              if [[ "$still_there" == "true" ]]; then
                echo "${n}:${exp_days}" >> "$remaining_file"
                continue
              fi
              echo "Closing issue #${n}: expired, resources confirmed absent."
              # Workshop sub-issues (expiration <= 7d) close bare, as the
              # retired sweep did; individual/course requests get the
              # end-of-lifespan comment.
              if (( $(echo "$exp_days <= 7" | bc -l) )); then
                gh issue close "$n"
              else
                gh issue close "$n" --comment "This instance request has reached the end of its lifespan and its resources have been released. To start a new instance, [open a new request](https://github.com/${GH_REPO}/issues/new/choose)."
              fi
            done < "$candidates_file"

            mv "$remaining_file" "$candidates_file"
            if [[ ! -s "$candidates_file" ]]; then
              echo "All expired issues closed."
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::warning ::Deletions still in flight for issue(s): $(cut -d: -f1 "$candidates_file" | tr '\n' ' '); they close on the next run."
              break
            fi
            sleep 30
          done
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          EXPIRATION_WARNING_DAYS: 7
          FINAL_WARNING_DAYS: 1
          COURSE_TEAM_SLUG: ${{ vars.COURSE_TEAM_SLUG }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}

      - name: Close workshop parent issues whose sub-issues are all closed
        shell: bash
        run: |
          gh issue list --label "request-type:workshop" --state open --limit 500 --json number --jq '.[].number' | \
          while read -r workshop_issue_number; do
            # No fallback on failure: a mid-pagination error would leave
            # partial pages on stdout, and counting them could close a parent
            # whose unseen sub-issues are still open. Let the step fail loudly
            # instead; a workshop with no sub-issues returns [] successfully.
            sub_issues_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GH_REPO/issues/$workshop_issue_number/sub_issues" \
              --paginate \
              --jq '[.[].state]')

            # --paginate emits one array per page; slurp+flatten makes the
            # counts correct for workshops larger than one page (100).
            total_sub_issues=$(echo "$sub_issues_json" | jq -s 'flatten | length')
            open_sub_issues=$(echo "$sub_issues_json" | jq -s 'flatten | map(select(. == "open")) | length')

            # total > 0 guards the vacuous case: a workshop whose sub-issues
            # have not been created yet must not be closed.
            if [[ "$total_sub_issues" -gt 0 && "$open_sub_issues" -eq 0 ]]; then
              echo "Closing workshop issue #${workshop_issue_number}: all ${total_sub_issues} sub-issue(s) closed."
              gh issue close "$workshop_issue_number" --comment "All workshop instances have expired and been deleted. Closing workshop issue."
            else
              echo "Skipping workshop issue #${workshop_issue_number}: ${open_sub_issues}/${total_sub_issues} sub-issue(s) still open."
            fi
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
