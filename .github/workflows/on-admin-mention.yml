name: "Notify Admins of Team Mention in Comment"
on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  notify-on-mention:
    runs-on: ubuntu-latest
    # Two ways to earn an admin email, because the mentions come from two
    # kinds of author:
    #
    #   humans — every MorphoCloud user is an org member, so the association
    #     gate keeps the alert working for real users while stopping arbitrary
    #     accounts from pushing attacker-authored content into admin inboxes
    #     from the trusted sender (security review L1).
    #   our own automation — reconcile-instances and the command workflows
    #     post their alerts as bots, whose author_association is never
    #     OWNER/MEMBER/COLLABORATOR. The blanket `user.type != 'Bot'` test
    #     therefore skipped every automated alert this workflow exists to
    #     deliver: 198 of its first 200 runs were skipped, and an instance sat
    #     in ERROR unnoticed while its issue claimed admins "have been
    #     notified" (Instances#110, 2026-07-28). Allow the two first-party
    #     bots by login — their comment bodies are our own templates — and
    #     keep every other bot blocked.
    if: >-
      contains(github.event.comment.body, '@MorphoCloud/morphocloud-admins') &&
      ( (github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER",
      "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      contains(fromJSON('["github-actions[bot]",
      "morphocloud-workflow-app[bot]"]'), github.event.comment.user.login) )
    steps:
      - name: Send mail (admin team mentioned)
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: webhost.dynadot.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: MorphoCloudPortal <no-reply@morphocloud.org>
          to: ${{ vars.MORPHOCLOUD_GITHUB_ADMIN_EMAILS }}
          subject:
            "[${{ github.event.repository.name }}]
            @MorphoCloud/morphocloud-admins mentioned by @${{
            github.event.comment.user.login }} in issue #${{
            github.event.issue.number }}"
          body: |
            @${{ github.event.comment.user.login }} mentioned @MorphoCloud/morphocloud-admins in issue #${{ github.event.issue.number }}.

            Comment:
            ${{ github.event.comment.body }}

            See: ${{ github.event.comment.html_url }}
