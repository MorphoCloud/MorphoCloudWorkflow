name: Delete long-shelved instances

# Long-shelved instances (STORAGE_REDESIGN_PLAN.md decision 21): once a week,
# a member's instance shelved for more than MORPHOCLOUD_SHELVED_DELETE_DAYS
# (Nova's action history: the latest shelve) is deleted and its request
# closed; the member is emailed that their files in MyDrive are safe and when
# MyDrive is kept until. An instance whose age cannot be read is never
# deleted; the admins hear of it. Share mode only; off unless the repository
# sets the days.

on:
  # dispatch: 20 13 * * 1
  # The runner's crontab is the clock (scripts/runner-cron-dispatcher.md). The
  # schedule below is only a backstop: GitHub fires it a few times a day.
  schedule:
    - cron: "20 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print only: delete nothing, send nothing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: delete-long-shelved
  cancel-in-progress: false

jobs:
  scrub:
    if:
      ${{ vars.MORPHOCLOUD_SHELVED_DELETE_DAYS != '' &&
      vars.MORPHOCLOUD_STORAGE_MODE == 'share' }}
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Fetch the email copy
        shell: bash
        run: |
          curl -sfL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/storage-term.json" "$TEMPLATE_URL"
        env:
          TEMPLATE_URL:
            https://raw.githubusercontent.com/MorphoCloud/MorphoCloudPortalContent/${{
            vars.MORPHOCLOUD_TEMPLATE_REF || 'main'
            }}/templates/storage-term.json

      - name: Delete and tell the members
        id: act
        shell: bash
        run: |
          set -euo pipefail
          source ~/venv/bin/activate
          python3 .github/actions/expire-shares/scrub.py
        env:
          TEMPLATE_FILE: ${{ runner.temp }}/storage-term.json
          SHELVED_DAYS: ${{ vars.MORPHOCLOUD_SHELVED_DELETE_DAYS }}
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          # The runner reads these: the instance names, and MyDrive's end date.
          MC_INSTANCE_NAME_PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          INSTANCE_PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          MC_SHARE_TERM_DAYS: ${{ vars.MORPHOCLOUD_SHARE_TERM_DAYS || '0' }}
          LOOKUP_URL: ${{ vars.MORPHOCLOUD_EMAIL_LOOKUP_URL }}
          LOOKUP_API_KEY: ${{ secrets.MORPHOCLOUD_LOOKUP_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PORTAL_URL: ${{ vars.MORPHOCLOUD_DATA_PORTAL_URL }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Alert the admins
        if: ${{ failure() && vars.MORPHOCLOUD_GITHUB_ADMIN_EMAILS != '' }}
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: webhost.dynadot.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: MorphoCloudPortal <no-reply@morphocloud.org>
          to: ${{ vars.MORPHOCLOUD_GITHUB_ADMIN_EMAILS }}
          subject:
            "[${{ github.repository }}] Long-shelved instance scrub failed"
          body: |
            The weekly scrub of long-shelved instances did not finish cleanly. Nothing was deleted for an instance whose age is unknown; the next weekly run tries again.

            ${{ steps.act.outputs.failures || 'The scrub failed before acting on any instance; see the run log.' }}

            Run log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
