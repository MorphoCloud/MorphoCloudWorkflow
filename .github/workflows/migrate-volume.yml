name: Migrate Volume to Share

# Decision 32 (INSTANCE_DASHBOARD_PLAN.md): one member's MyData volume moved
# onto their share by mc_migrate_volume.py (portal repository, deployed to
# ~/mc-data on the acquire runner next to the share runner). Without
# `commit` it measures and reports; with it, it copies, verifies, renames the
# volume and the old server `legacy-…` and stamps the share. The report is
# posted on the member's issue either way.

on:
  # dispatch: manual
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number of the member's instance request"
        required: true
        type: number
      commit:
        description:
          "Copy, verify and rename (unchecked = dry run: measure and report
          only)"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  migrate:
    runs-on: ${{ vars.MORPHOCLOUD_ACQUIRE_RUNNER || 'self-hosted' }}
    # One member at a time per allocation: the runner's mount points and
    # the share runner's state are shared.
    concurrency:
      group: migrate-volume-${{ vars.MORPHOCLOUD_OS_CLOUD }}
      cancel-in-progress: false
    steps:
      - name: Migrate
        id: migrate
        run: |
          source ~/venv/bin/activate
          args=(--issue "$ISSUE_NUMBER")
          if [[ "$COMMIT" == "true" ]]; then args+=(--commit); fi
          rc=0
          python3 "$HOME/mc-data/mc_migrate_volume.py" "${args[@]}" > "$RUNNER_TEMP/migrate-report.md" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/migrate-report.md"
          printf '\n<sub>Run: https://github.com/%s/actions/runs/%s</sub>\n' "$GH_REPO" "$RUN_ID" >> "$RUNNER_TEMP/migrate-report.md"
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          MC_INSTANCE_NAME_PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMIT: ${{ inputs.commit }}
          RUN_ID: ${{ github.run_id }}

      - name: Post the report on the issue
        if: ${{ always() && steps.migrate.outcome != 'skipped' }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/migrate-report.md" \
            || echo "::warning ::Could not post the report on issue #$ISSUE_NUMBER"
          if [[ "$RC" == "0" && "$COMMIT" == "true" ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "storage:migrated" \
              || echo "::warning ::Could not label issue #$ISSUE_NUMBER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMIT: ${{ inputs.commit }}
          RC: ${{ steps.migrate.outputs.rc }}

      - name: Fail the run when the script did
        if: ${{ steps.migrate.outputs.rc != '0' }}
        run: |
          echo "::error ::migration script exited ${RC}; see the report on issue #${ISSUE_NUMBER}"
          exit 1
        env:
          RC: ${{ steps.migrate.outputs.rc }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
