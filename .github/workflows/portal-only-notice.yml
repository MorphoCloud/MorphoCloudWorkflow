name: Portal-only notice

# Portal-only mode (INSTANCE_DASHBOARD_PLAN.md decision 18): a command typed
# on an individual request on GitHub is refused by the command workflows'
# allowlists (only the portal's app and admins may run them). This adds one
# reply pointing the member to the portal. Off unless MORPHOCLOUD_PORTAL_ONLY
# is 'true'.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    if:
      ${{ vars.MORPHOCLOUD_PORTAL_ONLY == 'true' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'request-type:instance') &&
      startsWith(github.event.comment.body, '/') &&
      github.event.comment.performed_via_github_app.slug !=
      vars.MORPHOCLOUD_PORTAL_APP_SLUG && github.event.comment.user.type !=
      'Bot' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Check admin team membership
        id: admin
        uses: ./.github/actions/check-team-membership
        with:
          token: ${{ steps.app-token.outputs.token }}
          org: ${{ github.repository_owner }}
          team_slug: morphocloud-admins
          username: ${{ github.event.comment.user.login }}

      - name: Point the member to the portal
        if: ${{ steps.admin.outputs.is_member == 'false' }}
        run: |
          printf 'Commands typed here are not run. Please manage your instance on the MorphoCloud portal: %s\n' \
            "${PORTAL_URL:-https://morphocloud.org}" > "$RUNNER_TEMP/portal-only.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/portal-only.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PORTAL_URL: ${{ vars.MORPHOCLOUD_DATA_PORTAL_URL }}
