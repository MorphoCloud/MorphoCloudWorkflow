name: Guard Issue Close

on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read

# An instance issue is the control panel for its instance's whole lifetime.
# When a user closes one while resources still exist, closing means "I'm
# done for now": an active instance is shelved (allocation burn stops, data
# and volume preserved, fully reversible), and a comment explains how to
# resume or release. In share mode a member's own request is instead
# deleted: the request covers one instance's lifetime and the files are in
# the storage (see the step). Bot closes are skipped — automation closes
# issues only after deletion, so nothing fires for those.
jobs:
  guard:
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    if:
      ${{ contains(github.event.issue.labels.*.name, 'instance-request') &&
      github.event.sender.type != 'Bot' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Shelve on close
        shell: bash
        run: |
          source ~/venv/bin/activate

          INSTANCE_PREFIX="${INSTANCE_NAME_PREFIX:+${INSTANCE_NAME_PREFIX}_}"
          INSTANCE_NAME="${INSTANCE_PREFIX}instance-${ISSUE_NUMBER}"
          VOLUME_NAME="My-Data-${ISSUE_NUMBER}"

          SERVER_STATUS=$(openstack server list --name "^${INSTANCE_NAME}$" -f json | \
            jq -r '.[0].Status // empty')
          HAS_VOLUME="false"
          if openstack volume list -f json | jq -r '.[].Name' | grep -qE "^${VOLUME_NAME}(-.*)?$"; then
            HAS_VOLUME="true"
          fi

          if [[ -z "$SERVER_STATUS" && "$HAS_VOLUME" == "false" ]]; then
            echo "No resources for #${ISSUE_NUMBER} — close is fine."
            exit 0
          fi

          # Share mode, a member's own request: the request covers one
          # instance's lifetime (STORAGE_REDESIGN_PLAN.md, decision 15), and a
          # closed request would leave an instance the portal no longer shows
          # while its owner can create a second one onto the same storage
          # (decision 17). So the close deletes the instance, the same clean
          # shutdown as every delete; the files are in the storage.
          if [[ "$STORAGE_MODE" == "share" && "$IS_USER_REQUEST" == "true" && -n "$SERVER_STATUS" ]]; then
            echo "Deleting $INSTANCE_NAME (status: $SERVER_STATUS) after the request was closed..."
            if GH_TOKEN="$APP_TOKEN" gh workflow run control-instance-from-workflow.yml \
              -f issue_number="$ISSUE_NUMBER" \
              -f command_name=delete \
              -f unapprove_after_delete=true; then
              gh issue comment "$ISSUE_NUMBER" --body "### Request closed

          You closed this request, so its instance **${INSTANCE_NAME}** is being deleted (it is shut down cleanly first). Files in your storage are not affected.

          To get a new instance, create one from the portal${PORTAL_URL:+: $PORTAL_URL}."
              exit 0
            fi
            echo "::error ::Failed to dispatch the delete workflow for ${INSTANCE_NAME}"
            gh issue comment "$ISSUE_NUMBER" --body "### Request closed

          You closed this request, but its instance **${INSTANCE_NAME}** could not be deleted automatically and still exists (@MorphoCloud/morphocloud-admins — the delete dispatch failed, please delete it). Files in your storage are not affected."
            exit 1
          fi

          dispatch_failed=false
          if [[ "$SERVER_STATUS" == "ACTIVE" || "$SERVER_STATUS" == "SHUTOFF" ]]; then
            echo "Shelving $INSTANCE_NAME (status: $SERVER_STATUS) after issue close..."
            # Guard the dispatch: an unguarded failure used to still post
            # "is being shelved" while the instance kept running (#228).
            if GH_TOKEN="$APP_TOKEN" gh workflow run control-instance-from-workflow.yml \
              -f issue_number="$ISSUE_NUMBER" \
              -f command_name=shelve; then
              STATE="**${INSTANCE_NAME}** is being shelved — allocation usage stops; your data and volume are preserved"
            else
              echo "::error ::Failed to dispatch the shelve workflow for ${INSTANCE_NAME}"
              dispatch_failed=true
              STATE="**${INSTANCE_NAME}** could not be shelved automatically and is still running (@MorphoCloud/morphocloud-admins — the shelve dispatch failed, please shelve it manually); your data and volume are preserved"
            fi
          elif [[ "$SERVER_STATUS" == "SHELVED" || "$SERVER_STATUS" == "SHELVED_OFFLOADED" ]]; then
            echo "$INSTANCE_NAME is $SERVER_STATUS — nothing to shelve."
            STATE="**${INSTANCE_NAME}** remains shelved; your data and volume are preserved"
          elif [[ -n "$SERVER_STATUS" ]]; then
            # ERROR/BUILD/PAUSED/… — saying "remains shelved" here would be
            # untrue (#228); report the actual state.
            echo "$INSTANCE_NAME is $SERVER_STATUS — nothing to shelve."
            STATE="**${INSTANCE_NAME}** is currently in \`${SERVER_STATUS}\` state and was not shelved; your data and volume are preserved"
          else
            STATE="the **${VOLUME_NAME}** data volume is preserved"
          fi

          gh issue comment "$ISSUE_NUMBER" --body "### Issue closed with resources still allocated

          Closing this issue does not delete anything: ${STATE}, and the expiration policy still applies.

          - To resume working: reopen this issue and comment \`/unshelve\`.
          - To release the resources permanently: comment \`/delete_all\`."

          if [[ "$dispatch_failed" == "true" ]]; then
            exit 1
          fi
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          INSTANCE_NAME_PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STORAGE_MODE: ${{ vars.MORPHOCLOUD_STORAGE_MODE }}
          PORTAL_URL: ${{ vars.MORPHOCLOUD_DATA_PORTAL_URL }}
          IS_USER_REQUEST:
            ${{ contains(github.event.issue.labels.*.name,
            'request-creator:user') }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # The comment's @mention is posted with GITHUB_TOKEN, which raises no
      # event, so it reaches nobody (see control-instance): the email is what
      # makes "the admins have been notified" true.
      - name: Notify admins by email (dispatch failed)
        if: ${{ failure() && vars.MORPHOCLOUD_GITHUB_ADMIN_EMAILS != '' }}
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
        with:
          server_address: webhost.dynadot.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: MorphoCloudPortal <no-reply@morphocloud.org>
          to: ${{ vars.MORPHOCLOUD_GITHUB_ADMIN_EMAILS }}
          subject:
            "[${{ github.repository }}] Request #${{ github.event.issue.number
            }} closed, its instance could not be handled"
          body: |
            The owner closed request #${{ github.event.issue.number }} while its instance still exists, and the shelve/delete dispatch failed. The instance is still running or allocated; please handle it by hand.

            Issue: https://github.com/${{ github.repository }}/issues/${{ github.event.issue.number }}
            Run log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
