name: Automatic Instance Shelving
on:
  # dispatch: */5 * * * *
  # The runner's crontab is the clock (scripts/runner-cron-dispatcher.md). The
  # schedule below is only a backstop: GitHub fires it a few times a day.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ vars.MORPHOCLOUD_OS_CLOUD }}
  cancel-in-progress: false # queue a starved cycle, don't drop it (shelving must run, even if late)

permissions:
  issues: write
  contents: read

jobs:
  auto-shelve:
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MORPHOCLOUD_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.MORPHOCLOUD_WORKFLOW_APP_PRIVATE_KEY }}

      - name: Auto Shelve
        run: |
          source ~/venv/bin/activate

          instance_prefix=${PREFIX:+${PREFIX}_}
          instance_basename="${instance_prefix}instance"

          # INSTANCE_DASHBOARD_PLAN.md decision 26: an instance this job cannot
          # reach is never skipped. Up for 30 minutes or more and not answering
          # (three tries, 20 s apart), it is shelved on the wall clock through
          # the same dispatch workshops use; younger, it is left to finish
          # booting and looked at again next tick. Skipping it (the old
          # `continue`) let a network-orphaned GPU instance run for days.
          unreachable_after_min=30
          # Returns 255 only when SSH itself could not connect (ssh's own code),
          # three tries 20 s apart; a command that ran and failed returns its
          # own code at once: the instance answered, it is not unreachable.
          ssh_out() {  # $1 address, $2 command
            local i rc
            for i in 1 2 3; do
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR -o ConnectTimeout=15 "exouser@$1" "$2" < /dev/null
              rc=$?
              (( rc == 0 )) && return 0
              (( rc != 255 )) && return "$rc"
              [[ $i -lt 3 ]] && sleep 20
            done
            return 255
          }
          shelve_if_unreachable() {  # $1 instance name, $2 issue number, $3 what failed
            local since age_min
            since=$(openstack server event list "$1" -f json \
              | jq -r '[.[] | select(.Action == "create" or .Action == "unshelve" or .Action == "start" or .Action == "reboot") | ."Start Time"] | max // empty')
            if [[ -z "$since" ]]; then
              echo "::warning ::$1 (issue #$2): $3, and when it started is unknown; left for the next tick"
              return
            fi
            local start_epoch
            if ! start_epoch=$(date -u -d "${since%%.*}" +%s 2>/dev/null); then
              echo "::warning ::$1 (issue #$2): $3, and its start time '$since' could not be read; left for the next tick"
              return
            fi
            age_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
            if (( age_min < unreachable_after_min )); then
              echo "$1 (issue #$2): $3; up for ${age_min} min (< ${unreachable_after_min}): waiting"
              return
            fi
            echo "$1 (issue #$2): $3 after ${age_min} min up. Shelving on the wall clock."
            gh issue comment "$2" --body "Your instance has not answered on the network for ${age_min} minutes since it started, so it is being shelved. Unshelve places it afresh." \
              || echo "::warning ::Could not post the shelve note on issue #$2"
            if ! gh workflow run control-instance-from-workflow.yml \
              -f issue_number="$2" \
              -f command_name=shelve; then
              echo "::error ::Failed to trigger the shelve workflow for unreachable $1 (issue #$2)"
            fi
          }

          openstack server list --name "^${instance_basename}-\d+" -f json | \
          jq -r '.[] | [.Name, .Status, ."OS-EXT-STS:task_state"] | @tsv' | \
            while IFS=$'\t' read -r instance_name status task_state; do
              echo "instance_name [$instance_name] status [$status] task_state [$task_state]"

              # Skip the instance if it is currently undergoing a status update
              if [[ "$task_state" != "" ]]; then
                continue
              fi

              # If instance is SHUTOFF, shelve it immediately
              if [[ "$status" == "SHUTOFF" ]]; then
                # Extract the issue number from the instance name
                issue_number=${instance_name##*-}

                # Validate issue number extraction
                if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
                  echo "::warning ::Failed to extract valid issue number from instance name [$instance_name]"
                  continue
                fi

                echo "Detected SHUTOFF instance [$instance_name] (issue #$issue_number). Shelving immediately to prevent credit usage."

                if ! gh workflow run control-instance-from-workflow.yml \
                  -f issue_number=$issue_number \
                  -f command_name=shelve; then
                  echo "::warning ::Failed to trigger shelve workflow for instance [$instance_name] (issue #$issue_number)"
                fi
                continue
              fi

              # Skip the instance if it is not active
              if [[ "$status" != "ACTIVE" ]]; then
                continue
              fi

              # Extract the issue number from the instance name
              issue_number=${instance_name##*-}
              echo "issue_number [$issue_number]"

              # Validate issue number extraction (mirrors the SHUTOFF path above)
              # so the label read below fails on a real problem, not a bad name.
              if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
                echo "::warning ::Failed to extract valid issue number from instance name [$instance_name]"
                continue
              fi

              # Read this instance's issue labels ONCE and reuse them for both the
              # workshop shelve-at discriminator (below) and the individual
              # timeout:Nhrs lookup (further down) -- avoids a second gh API call
              # per individual instance on every 5-min tick.
              if ! issue_labels="$(gh issue view "$issue_number" --json labels)"; then
                echo "::warning ::Failed to retrieve labels for issue $issue_number (instance $instance_name). Skipping."
                continue
              fi

              # --- Workshop instances: wall-clock shelve (issue #254) ---
              # Workshop sub-issues carry an absolute "shelve-at:<epoch>" label
              # (stamped by create-workshop.yml = workshop end + 1h grace). For
              # these, shelve purely on wall-clock via the control plane: NO SSH,
              # no uptime, no timeout read. This is reboot- and outage-immune -- a
              # mid-workshop reboot resets guest uptime and would defer the old
              # uptime-based shelve indefinitely (incident: workshop #144). The
              # presence of the label IS the workshop discriminator; individual
              # instances have none and fall through to the uptime/SSH path below,
              # unchanged.
              shelve_at="$(jq -r '[.labels[].name
                    | select(test("^shelve-at:[0-9]+$"))
                    | capture(":(?<n>[0-9]+)$").n
                    | tonumber] | max // empty' <<<"$issue_labels")"

              if [[ -n "$shelve_at" ]]; then
                now=$(date +%s)
                if (( now >= shelve_at )); then
                  echo "Workshop instance [$instance_name] (issue #$issue_number) due to shelve (now=$now >= shelve-at=$shelve_at). Shelving."
                  if ! gh workflow run control-instance-from-workflow.yml \
                    -f issue_number=$issue_number \
                    -f command_name=shelve; then
                    echo "::warning ::Failed to trigger shelve workflow for workshop instance [$instance_name] (issue #$issue_number)"
                  fi
                else
                  echo "Workshop instance [$instance_name] (issue #$issue_number) not yet due (now=$now < shelve-at=$shelve_at). Skipping."
                fi
                continue
              fi

              # Retrieve the IP address of the instance. A failed read (an
              # OpenStack hiccup) must not end the run under -e: say so and
              # look at this instance again next tick.
              if ! instance_ip=$(
                openstack server show "$instance_name" -c addresses -f json | \
                jq -r '.addresses.auto_allocated_network[1]'
              ); then
                echo "::warning ::Could not read the address of $instance_name; left for the next tick"
                continue
              fi
              echo "instance_ip [$instance_ip]"

              # No public address on an active instance: nobody can reach it
              # (decision 25 shelves such an unshelve itself; this is the backstop).
              if [[ "$instance_ip" == "null" ]]; then
                shelve_if_unreachable "$instance_name" "$issue_number" "has no public address" || true
                continue
              fi

              # Notes on SSH usage:
              # * Redirecting SSH standard input to /dev/null ('< /dev/null') is required to work around
              #   an issue where SSH breaks out of the while loop in Bash.
              #   Reference: https://stackoverflow.com/questions/9393038/ssh-breaks-out-of-while-loop-in-bash

              # The `|| rc=$?` form matters: the job shell runs with -e, and a
              # bare failing assignment would end the whole run (seen on the
              # first test, exit 255 after the three tries).
              rc=0
              has_check_instance_shelve_script=$(ssh_out "$instance_ip" \
                  'bash -c "[[ -f /opt/instance-config-support/dist/check-instance-shelve.sh ]] && echo yes || echo no"') || rc=$?
              if (( rc == 255 )); then
                shelve_if_unreachable "$instance_name" "$issue_number" "does not answer on $instance_ip" || true
                continue
              elif (( rc != 0 )); then
                echo "::warning ::Could not check for 'check-instance-shelve.sh' on $instance_name ($instance_ip): exit $rc"
                continue
              fi

              if [[ "$has_check_instance_shelve_script" == "yes" ]]; then
                rc=0
                uptime_hours=$(ssh_out "$instance_ip" \
                    '/opt/instance-config-support/dist/check-instance-shelve.sh -d') || rc=$?
                if (( rc == 255 )); then
                  shelve_if_unreachable "$instance_name" "$issue_number" "stopped answering on $instance_ip" || true
                  continue
                elif (( rc != 0 )); then
                  echo "::warning ::check-instance-shelve.sh failed on $instance_name ($instance_ip): exit $rc; it answers, so it is left alone"
                  continue
                fi
              else
                # Retrieve the instance uptime using SSH
                rc=0
                uptime_seconds=$(ssh_out "$instance_ip" \
                    'cat /proc/uptime | awk  "{print \$1}"') || rc=$?
                if (( rc == 255 )); then
                  shelve_if_unreachable "$instance_name" "$issue_number" "stopped answering on $instance_ip" || true
                  continue
                elif (( rc != 0 )); then
                  echo "::warning ::Could not read the uptime of $instance_name ($instance_ip): exit $rc; it answers, so it is left alone"
                  continue
                fi
                # $uptime_seconds also comes from the instance. bc cannot execute
                # shell commands, but a crafted value can still steer the arithmetic
                # (e.g. "x=0; 999999999" yields a large, well-formed number) and so
                # forge the shelve decision. Validate before it reaches bc.
                if ! [[ "$uptime_seconds" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                  echo "::warning ::Non-numeric uptime ('$uptime_seconds') reported by $instance_name using IP $instance_ip; skipping"
                  continue
                fi
                # Convert uptime from seconds to hours. bc omits the leading zero
                # for values under 1 ("900/3600" -> ".25"), which the numeric check
                # below would reject; normalise so sub-hour instances don't trip it.
                uptime_hours=$(echo "scale=2; $uptime_seconds / 3600" | bc | awk '{printf "%.2f", $1}')
              fi

              # $uptime_hours comes from the instance, which the user controls
              # (exouser has NOPASSWD sudo). Validate it is a bare number before
              # it reaches any evaluator — same treatment $timeout_hrs gets below.
              if ! [[ "$uptime_hours" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::warning ::Non-numeric uptime ('$uptime_hours') reported by $instance_name using IP $instance_ip; skipping"
                continue
              fi

              # Data portal (share mode): report the session age so its
              # countdown also reflects extends made on the desktop. Only a
              # runner set up for the portal has ~/mc-data/portal_target; a
              # failure here never affects shelving.
              if [[ -s "$HOME/mc-data/portal_target" ]]; then
                printf '{"issue": %d, "elapsed_hours": %s}' "$issue_number" "$uptime_hours" \
                  | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                      "$(cat "$HOME/mc-data/portal_target")" session "$issue_number" >/dev/null 2>&1 \
                  || echo "::warning ::Could not report the session age of #$issue_number to the data portal"
              fi

              # Derive timeout_hrs from labels like "timeout:24hrs", reusing the
              # labels fetched once above (no second gh issue view).
              timeout_hrs="$(jq -r '[.labels[].name
                    | select(test("^timeout:[0-9]+hrs$"))
                    | capture(":(?<n>[0-9]+)hrs$").n
                    | tonumber] | max // empty' <<<"$issue_labels")"

              if [[ -z "$timeout_hrs" ]]; then
                # Fall back to repo variable INSTANCE_SHELVING_TIMEOUT_HRS, then hardcoded 4.
                # Course repos can set this variable to allow longer sessions.
                default_timeout=${INSTANCE_SHELVING_TIMEOUT_HRS:-4}
                if ! [[ "$default_timeout" =~ ^[0-9]+$ ]]; then
                  echo "::warning ::INSTANCE_SHELVING_TIMEOUT_HRS ('$default_timeout') is not a valid integer; defaulting to 4hrs"
                  default_timeout=4
                fi
                echo "::warning ::No 'timeout:NNhrs' label found for issue $issue_number (defaulting to ${default_timeout}hrs)"
                timeout_hrs=$default_timeout
              elif ! [[ "$timeout_hrs" =~ ^[0-9]+$ ]]; then
                echo "::warning ::Parsed timeout is not an integer ('$timeout_hrs'); defaulting to 4hrs"
                timeout_hrs=4
              fi

              echo "Timeout is set to [$timeout_hrs] hours."

              # Check uptime and define action
              # Note: The popup reminder is handled entirely by the instance-side cron
              # (check-instance-shelve.sh -a every 5 min). GitHub Actions cron is unreliable
              # for self-hosted runners and can miss narrow time windows, so we shelve as
              # soon as uptime exceeds the timeout regardless of when the run fires.
              # Values are passed as argv, never interpolated into the source, so
              # instance-supplied text cannot reach the Python parser. float() still
              # evaluates whatever it is given, so the numeric checks above remain the
              # primary guard — this is defence in depth, not a substitute for them.
              if python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) > float(sys.argv[2]) else 1)' "$uptime_hours" "$timeout_hrs"; then
                action="shelve"
              else
                action=""
              fi
              echo "instance_name [$instance_name], has_check_instance_shelve_script [$has_check_instance_shelve_script], uptime_hours [$uptime_hours] -> action[$action]"
              # Perform action
              if [[ "$action" == "shelve" ]]; then
                gh workflow run control-instance-from-workflow.yml \
                  -f issue_number=$issue_number \
                  -f command_name=shelve
              fi
            done
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
          INSTANCE_SHELVING_TIMEOUT_HRS:
            ${{ vars.INSTANCE_SHELVING_TIMEOUT_HRS }}
