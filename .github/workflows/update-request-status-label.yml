name: Update Request Status Label
on:
  # dispatch: */5 * * * *
  # The runner's crontab is the clock (scripts/runner-cron-dispatcher.md). The
  # schedule below is only a backstop: GitHub fires it a few times a day.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ vars.MORPHOCLOUD_OS_CLOUD }}
  cancel-in-progress: false # queue a starved cycle, don't drop it

permissions:
  issues: write
  contents: read

jobs:
  update-request-status-label:
    runs-on: ${{ vars.MORPHOCLOUD_CONTROL_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7

      - name: Update issues
        run: |
          source ~/venv/bin/activate

          instance_prefix=${PREFIX:+${PREFIX}_}
          instance_basename="${instance_prefix}instance"

          openstack server list --name "^${instance_basename}-\d+" --long -f json | \
          # setup_done comes before exosetup: tab is IFS whitespace, so an
          # empty field in the middle would shift the ones after it.
          jq -r -L "$GITHUB_WORKSPACE/.github/actions/setup-state" \
            'include "mc-setup";
             .[] | (.Properties // null) as $p
             | [.Name, .Status, ($p | mc_setup_done | tostring), ($p | mc_exo_setup_text)] | @tsv' | \
            while IFS=$'\t' read -r instance_name status setup_done exosetup; do
              issue_number=${instance_name##*-}
              status_lowercase=${status,,}

              add_label="status:$status_lowercase"

              # An OpenStack-ACTIVE server is still installing until
              # MorphoCloud's setup finished — labeling it "active" misled
              # users into thinking the instance was ready (tester feedback).
              # "Finished" is the shared rule (mcSetup, or exoSetup on servers
              # without it; SETUP_FINISHED_SIGNAL_DESIGN.md).
              if [[ "$status" == "ACTIVE" && "$exosetup" == *'"error"'* ]]; then
                # Decision 33: the instance's own setup script failed; the
                # server is up but will never be usable as built.
                add_label="status:error"
              elif [[ "$status" == "ACTIVE" && "$setup_done" != "true" ]]; then
                add_label="status:building"
              fi

              remove_labels=$(gh issue view $issue_number --json labels | \
                jq \
                  -r \
                  --arg add_label "$add_label" \
                  -c '[.labels[].name | select(test("^status:")?) | select(. != $add_label)] | join(",")')

              echo "Updating issue $issue_number adding label [$add_label] and removing labels [$remove_labels]"

              gh issue edit ${issue_number} --add-label "${add_label}" --remove-label "${remove_labels}"
            done
        env:
          OS_CLOUD: ${{ vars.MORPHOCLOUD_OS_CLOUD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.INSTANCE_NAME_PREFIX }}
