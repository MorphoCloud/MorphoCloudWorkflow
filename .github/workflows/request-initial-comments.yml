name: "Instance Request Initial Comments"
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
        type: string
      commands_md_path:
        description:
          "Path to the markdown file listing supported issue commands"
        required: false
        default: "issue-commands.md"
        type: string

jobs:
  initial_comments:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Inputs
        id: collect_inputs
        shell: bash
        run: |
          echo "EVENT_NAME [$EVENT_NAME]"
          if [[ "$EVENT_NAME" == "issues" ]]; then
            issue_number=${{ github.event.issue.number || inputs.issue_number }}
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            issue_number=${{ github.event.inputs.issue_number }}
          else
            echo "::error ::Unsupported EVENT_NAME [$EVENT_NAME]"
            exit 1
          fi
          if [[ -z "$issue_number" || "$issue_number" == "null" ]]; then
            echo "::error ::issue_number not provided"
            exit 1
          fi
          echo "issue_number=$issue_number" >> $GITHUB_OUTPUT
        env:
          EVENT_NAME: ${{ github.event_name }}

      - uses: actions/checkout@v6

      - name: Define instance name
        id: define
        uses: ./.github/actions/define-instance-name
        with:
          prefix: ${{ vars.INSTANCE_NAME_PREFIX }}
          issue_number: ${{ steps.collect_inputs.outputs.issue_number }}

      - name: description (instance name)
        uses: julien-deramond/update-issue-body@a7fae45395cac5a23318d38f7b09a58650dfe84f # v1.1.0
        with:
          issue-number: ${{ steps.collect_inputs.outputs.issue_number }}
          body: |
            ### Instance Name

            `${{ steps.define.outputs.instance_name }}`

            _The instance name is derived from the GitHub issue number using the template `${{ steps.define.outputs.instance_prefix }}instance-NNN`. The instance may also be located in the exosphere interface using this name._
          edit-mode: append
          append-separator: newline

      - name: Define volume name
        id: define_volume_name
        uses: ./.github/actions/define-volume-name
        with:
          issue_number: ${{ steps.collect_inputs.outputs.issue_number }}
          suffix: ${{ vars.VOLUME_NAME_SUFFIX }}

      - name: description (volume name)
        uses: julien-deramond/update-issue-body@a7fae45395cac5a23318d38f7b09a58650dfe84f # v1.1.0
        with:
          issue-number: ${{ steps.collect_inputs.outputs.issue_number }}
          body: |
            ### Volume Name

            `${{ steps.define_volume_name.outputs.volume_name }}`

            _The volume name is derived from the GitHub issue number using the template `My-Data-NNN${{ steps.define_volume_name.outputs.volume_suffix }}`. The volume may also be located in the exosphere interface using this name._
          edit-mode: append
          append-separator: newline

      - name: Find Issue Commands Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: fc_commands
        with:
          issue-number: ${{ steps.collect_inputs.outputs.issue_number }}
          comment-author: "github-actions[bot]"
          # Both the command table and the portal note carry this marker.
          body-includes: "<!-- morphocloud-commands -->"

      # Portal mode (MORPHOCLOUD_PORTAL_ONLY): members act from the portal, so
      # the request gets a note with its address instead of the command table.
      - name: Render the portal note
        id: portal_note
        if:
          ${{ inputs.commands_md_path == '' && vars.MORPHOCLOUD_PORTAL_ONLY ==
          'true' }}
        uses: chuhlomin/render-template@a7c644e341797d050d1cb24332d83791b9a46dae # v1
        with:
          template: issue-commands-portal.md
          vars: |
            portal_url: "${{ vars.MORPHOCLOUD_DATA_PORTAL_URL || 'https://morphocloud.org' }}"

      - name: comment (portal note)
        if: ${{ steps.portal_note.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc_commands.outputs.comment-id }}
          issue-number: ${{ steps.collect_inputs.outputs.issue_number }}
          body: ${{ steps.portal_note.outputs.result }}
          edit-mode: replace

      - name: comment (issue commands)
        if: ${{ steps.portal_note.outcome != 'success' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc_commands.outputs.comment-id }}
          issue-number: ${{ steps.collect_inputs.outputs.issue_number }}
          body-path: "${{ inputs.commands_md_path || 'issue-commands.md' }}"
          edit-mode: replace
