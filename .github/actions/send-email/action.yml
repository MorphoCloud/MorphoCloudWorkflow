name: "Send email"
description: "Send email with instance connection details"
inputs:
  os_cloud:
    description:
      "Name of the OpenStack cloud allocation to select openstack auth settings
      defined in '.config/openstack/clouds.yaml'"
    required: true
  token:
    description: "GITHUB_TOKEN or repo scoped PAT"
    required: true
  email_lookup_url:
    description: "URL of the Apps Script web app for email lookup"
    required: true
  email_lookup_api_key:
    description:
      "Optional API key for the lookup endpoint (required when lookup_url points
      at the morphocloud-intake app)"
    required: false
    default: ""
  issue_creator:
    description: "GitHub username of the issue creator"
    required: true
  mail_server_username:
    description: "mail server username"
    required: true
  mail_server_password:
    description: "mail server password"
    required: true
  instance_name:
    description: "Name of the instance to connect to"
    required: true
  instance_issue_number:
    description: "Reference of the GitHub issue associated with the instance"
    required: true
  expect_upload_page:
    description:
      "true when the instance was just created with the upload page, so an
      unreachable page is reported on the issue instead of silently omitted"
    required: false
    default: "false"
outputs:
  error_message:
    description: "Error message describing which steps failed"
    value: ${{ steps.set_error_message.outputs.error_message }}
runs:
  using: "composite"
  steps:
    - name: Look up email via Apps Script
      id: lookup_email
      uses: ./.github/actions/lookup-email
      with:
        lookup_url: ${{ inputs.email_lookup_url }}
        github_username: ${{ inputs.issue_creator }}
        api_key: ${{ inputs.email_lookup_api_key }}

    - name: Retrieve metadata
      id: instance_metadata
      uses: ./.github/actions/retrieve-metadata
      with:
        os_cloud: ${{ inputs.os_cloud }}
        instance_name: ${{ inputs.instance_name }}

    - name: Generate Guacamole Connection URL
      id: guacamole
      uses: ./.github/actions/generate-connection-url
      with:
        instance_ip: ${{ steps.instance_metadata.outputs.instance_ip }}

    # Instances created before the upload page existed have nothing on that
    # port, so the link is only put in the email when the page responds
    # (200 = page, 403 = its login form; anything else = not there).
    - name: Check the upload page
      id: upload_page
      shell: bash
      run: |
        # Right after creation the page may still be starting, so retry for
        # up to a minute; on /email and /unshelve one probe is enough.
        attempts=1
        if [[ "$EXPECT" == "true" ]]; then
          attempts=6
        fi
        code=000
        for attempt in $(seq 1 "$attempts"); do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$UPLOAD_URL" || true)
          if [[ "$code" == "200" || "$code" == "403" ]]; then
            break
          fi
          if [[ "$attempt" -lt "$attempts" ]]; then
            sleep 10
          fi
        done
        if [[ "$code" == "200" || "$code" == "403" ]]; then
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "upload_url=" >> "$GITHUB_OUTPUT"
        echo "::warning ::Upload page not reachable at $UPLOAD_URL (last HTTP status $code); the email omits it."
        if [[ "$EXPECT" == "true" ]]; then
          printf 'The upload page on **%s** did not respond (HTTP %s), so the email does not include its link. Run `/email` later to try again.\n' "$INSTANCE_NAME" "$code" > "/tmp/upload-page-${ISSUE_NUMBER}.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "/tmp/upload-page-${ISSUE_NUMBER}.md" || true
          rm -f "/tmp/upload-page-${ISSUE_NUMBER}.md"
        fi
      env:
        UPLOAD_URL: ${{ steps.guacamole.outputs.upload_url }}
        EXPECT: ${{ inputs.expect_upload_page }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.instance_issue_number }}
        INSTANCE_NAME: ${{ inputs.instance_name }}

    # Email copy lives in MorphoCloudPortalContent (instance-credentials.json),
    # fetched at send time — copy edits go live on the next /create or /email
    # with no vendorize. render.py substitutes the placeholders (plain string
    # replace, safe for URLs and passphrases).
    - name: Fetch and render email template
      id: render
      shell: bash
      run: |
        curl -sfL --retry 3 --retry-delay 5 --retry-all-errors \
          -o /tmp/instance-credentials.json "$TEMPLATE_URL"
        python3 "$GITHUB_ACTION_PATH/render.py" /tmp/instance-credentials.json
      env:
        TEMPLATE_URL: https://raw.githubusercontent.com/MorphoCloud/MorphoCloudPortalContent/main/templates/instance-credentials.json
        REPO_NAME: ${{ github.event.repository.name }}
        REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.instance_issue_number }}
        INSTANCE_NAME: ${{ inputs.instance_name }}
        INSTANCE_IP: ${{ steps.instance_metadata.outputs.instance_ip }}
        CONNECTION_URL: ${{ steps.guacamole.outputs.connection_url }}
        UPLOAD_URL: ${{ steps.upload_page.outputs.upload_url }}
        PASSPHRASE: ${{ steps.instance_metadata.outputs.instance_pwd }}

    # The data portal's instance dashboard shows the same access details as
    # this email. Only a runner set up for the portal has
    # ~/mc-data/portal_target (Test-Instances); everywhere else this is a no-op.
    # Never fails the email: a failure is reported on the issue instead.
    - name: Send access details to the portal
      shell: bash
      run: |
        target_file="$HOME/mc-data/portal_target"
        [[ -s "$target_file" ]] || exit 0
        payload=$(jq -n --argjson issue "$ISSUE_NUMBER" --arg login "$ISSUE_CREATOR" \
          --arg instance_name "$INSTANCE_NAME" --arg web_url "$CONNECTION_URL" \
          --arg ip "$INSTANCE_IP" --arg passphrase "$PASSPHRASE" \
          '{issue: $issue, login: $login, instance_name: $instance_name,
            web_url: $web_url, ip: $ip, passphrase: $passphrase}')
        if ! printf '%s' "$payload" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$(cat "$target_file")" connection "$ISSUE_NUMBER"; then
          echo "::warning ::Could not send the access details to the data portal."
          gh issue comment "$ISSUE_NUMBER" --body "The access details could not be shown on the data portal. They are in your email." || true
        fi
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.instance_issue_number }}
        ISSUE_CREATOR: ${{ inputs.issue_creator }}
        INSTANCE_NAME: ${{ inputs.instance_name }}
        INSTANCE_IP: ${{ steps.instance_metadata.outputs.instance_ip }}
        CONNECTION_URL: ${{ steps.guacamole.outputs.connection_url }}
        PASSPHRASE: ${{ steps.instance_metadata.outputs.instance_pwd }}

    - name: Send mail
      uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
      with:
        server_address: webhost.dynadot.com
        server_port: 587
        secure: false
        username: ${{ inputs.mail_server_username }}
        password: ${{ inputs.mail_server_password }}
        from: MorphoCloudPortal <no-reply@morphocloud.org>
        to: ${{ steps.lookup_email.outputs.email }}
        subject: ${{ steps.render.outputs.subject }}
        convert_markdown: true
        html_body: ${{ steps.render.outputs.body }}
    - name: Set error message
      id: set_error_message
      if: ${{ failure() }}
      shell: bash
      run: |
        if [[ $INSTANCE_METADATA_OUTCOME == "failure" ]]; then
          error_message="Failed to retrieve metadata"
        elif [[ $GUACAMOLE_OUTCOME == "failure" ]]; then
          error_message="Failed to generate connection URL"
        elif [[ $RENDER_OUTCOME == "failure" ]]; then
          error_message="Failed to fetch or render the email template"
        fi
        echo "error_message=$error_message" >> $GITHUB_OUTPUT
      env:
        # Step outcome
        INSTANCE_METADATA_OUTCOME: ${{ steps.instance_metadata.outcome }}
        GUACAMOLE_OUTCOME: ${{ steps.guacamole.outcome }}
        RENDER_OUTCOME: ${{ steps.render.outcome }}
