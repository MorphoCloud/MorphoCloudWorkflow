name: "Retrieve metadata"
description: "Retrieve instance metadata"
inputs:
  os_cloud:
    description:
      "Name of the OpenStack cloud allocation to select openstack auth settings
      defined in '.config/openstack/clouds.yaml'"
    required: false
  os_application_credential_id:
    description: "OpenStack application credential ID (alternative to os_cloud)"
  os_application_credential_secret:
    description:
      "OpenStack application credential secret (alternative to os_cloud)"
  os_auth_url:
    description:
      "OpenStack identity endpoint URL (required when using app credentials)"
  os_identity_api_version:
    description: "OpenStack identity API version"
    default: "3"
  os_auth_type:
    description: "OpenStack auth type"
    default: "v3applicationcredential"
  instance_name:
    description: "Name of the instance to retrieve metadata from"
    required: true
outputs:
  instance_ip:
    description: "Public IP associated with the instance"
    value: ${{ steps.instance_metadata.outputs.instance_ip }}
  instance_pwd:
    description: "Passphrase associated with the instance"
    value: ${{ steps.instance_metadata.outputs.instance_pwd }}
runs:
  using: "composite"
  steps:
    - name: Retrieve metadata
      id: instance_metadata
      shell: bash
      run: |
        source ~/venv/bin/activate

        echo Retrieving instance "$INSTANCE_NAME" metadata

        # Get instance floating IP, with a retry budget. After a /unshelve the
        # VM returns to ACTIVE a few seconds before OpenStack reassociates its
        # floating IP, so a single read can see nothing and a credential
        # email would fail spuriously. Retry until the floating IP is
        # attached, mirroring the password retry below.
        #
        # Read from Neutron (the address bound to the server's port), not from
        # Nova's `addresses` view: that view is a cache, and it stayed stale
        # for over 40 minutes on Instances#214 (2026-11-04) after an address
        # was attached to a running server — Exosphere showed the address,
        # /email failed five minutes at a time (decision 29).
        ip_max_wait=300   # JS2 floating-IP reassociation after unshelve can be slow under load
        ip_interval=10
        ip_start=$SECONDS
        instance_ip=""
        while (( SECONDS - ip_start < ip_max_wait )); do
          # Both reads are guarded: under `bash -eo pipefail` a transient
          # API error would otherwise end the step instead of being retried.
          port_id=$(openstack port list --server "$INSTANCE_NAME" -f value -c ID | head -n1) || port_id=""
          instance_ip=""
          if [[ -n "$port_id" ]]; then
            instance_ip=$(openstack floating ip list --port "$port_id" -f value -c 'Floating IP Address' | head -n1) || instance_ip=""
          fi
          if [[ -n "$instance_ip" ]]; then
            echo "instance_ip [$instance_ip] (after $((SECONDS - ip_start))s)"
            break
          fi
          echo "floating IP not attached yet (waited $((SECONDS - ip_start))s of ${ip_max_wait}s); retrying in ${ip_interval}s..."
          sleep "$ip_interval"
        done
        if [[ -z "$instance_ip" ]]; then
          echo "::error ::Failed to retrieve $INSTANCE_NAME IP within ${ip_max_wait}s (floating IP never reassociated?)"
          exit 1
        fi
        # AUTOMATION_AUDIT_2026-11.md, class 1: the address is mailed to the
        # member and, without a cached tag, the password is read from it. Both
        # only once the instance at that address proves it is this server
        # (its metadata uuid is the server's id): a moved address would
        # otherwise send the member to another member's instance, or read
        # that instance's password. Waits up to 300 s for it to answer, as the
        # password read below did; nothing is mailed if it never proves itself.
        if ! instance_ip=$(python "$GITHUB_ACTION_PATH/../fip/fip.py" verify \
            --server "$INSTANCE_NAME" --ip "$instance_ip" --wait 300 | sed -n 's/^instance_ip=//p'); then
          echo "::error ::$INSTANCE_NAME could not be verified at its address; no access details are sent"
          exit 1
        fi
        [[ -n "$instance_ip" ]] || { echo "::error ::verify printed no address"; exit 1; }
        echo "instance_ip=$instance_ip" >> $GITHUB_OUTPUT

        # Get instance password from tags
        instance_pwd=$(
          openstack server show "$INSTANCE_NAME" -c tags -f json | \
          jq -r '.tags[] | select(startswith("exoPw")) | sub("^exoPw:"; "")'
        )
        # Mask immediately so the passphrase is never eligible for logging,
        # regardless of which branch below produces it.
        [[ -n "$instance_pwd" ]] && echo "::add-mask::$instance_pwd"

        # Retry logic for SSH-based password retrieval
        if [[ -z "$instance_pwd" ]]; then
          # The 'exoPw' tag may not be set yet — e.g. right after a cold
          # /unshelve, while the instance is still booting and sshd isn't
          # accepting connections (ssh fails with "connection refused"). Pull the
          # password from the instance metadata service over SSH, retrying on a
          # real-elapsed-time budget until sshd comes up.
          echo "Password not found in tags, attempting to retrieve via SSH..."
          max_wait=300   # up to 5 min — a cold unshelve can be slow to boot
          interval=15
          start=$SECONDS
          while (( SECONDS - start < max_wait )); do
            instance_pwd=$(ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR \
              -o ConnectTimeout=10 \
              exouser@"$instance_ip" \
              'curl --silent --retry 3 --retry-delay 5 --retry-all-errors http://169.254.169.254/openstack/latest/password' 2>/dev/null || true)
            if [[ -n "$instance_pwd" ]]; then
              echo "::add-mask::$instance_pwd"
              echo "Retrieved password after $((SECONDS - start))s."
              # Cache the passphrase as an 'exoPw' tag so subsequent /unshelve and
              # /email reads resolve it instantly (the tag branch above) and skip
              # this SSH path. The exouser passphrase is immutable for the life of
              # the server -- a MorphoCloud instance is destroyed+recreated, never
              # rebuilt in place -- so the cached tag never goes stale. Best-effort:
              # a failure here is non-fatal since we already have the password.
              #
              # 'server set --tag' is additive (per-tag PUT) in python-openstack
              # client >= 5.0.0; the runner installs it unpinned/latest (see
              # README and provision-instances-runner-host.sh), so other tags
              # (e.g. Exosphere's) are preserved. Nova also caps a tag at 60
              # chars; if 'exoPw:'+passphrase exceeds it the call 400s and we
              # fall back to SSH next time, hence the length in the warning.
              if openstack server set --tag "exoPw:$instance_pwd" "$INSTANCE_NAME"; then
                echo "Cached 'exoPw' tag on $INSTANCE_NAME for future reads."
              else
                echo "::warning ::Failed to cache 'exoPw' tag on $INSTANCE_NAME (non-fatal; tag is ${#instance_pwd}+6 chars, Nova limit is 60)."
              fi
              break
            fi
            echo "sshd/password not ready yet (waited $((SECONDS - start))s of ${max_wait}s); retrying in ${interval}s..."
            sleep "$interval"
          done
        fi
        if [[ -z "$instance_pwd" ]]; then
          echo "::error ::Failed to retrieve $INSTANCE_NAME password within ${max_wait}s (sshd never accepted connections?)"
          exit 1
        fi
        echo "::add-mask::$instance_pwd"
        echo "instance_pwd=$instance_pwd" >> $GITHUB_OUTPUT
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}
        OS_APPLICATION_CREDENTIAL_ID: ${{ inputs.os_application_credential_id }}
        OS_APPLICATION_CREDENTIAL_SECRET:
          ${{ inputs.os_application_credential_secret }}
        OS_AUTH_URL: ${{ inputs.os_auth_url }}
        OS_IDENTITY_API_VERSION: ${{ inputs.os_identity_api_version }}
        OS_AUTH_TYPE: ${{ inputs.os_auth_type }}
        INSTANCE_NAME: ${{ inputs.instance_name }}
