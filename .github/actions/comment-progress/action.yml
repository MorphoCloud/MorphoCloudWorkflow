name: "Create or update instance creation progress comment"
description: "Create or update instance creation progress comment"
inputs:
  create_ip:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  create_volume:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  create_instance:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  associate_ip:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  setup_instance:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  attach_volume:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  send_email:
    description: "Template input set to '', ✅ or ⏳"
    required: true
  issue-number:
    description: "The issue to add a comment to."
  comment-id:
    description: "The id of the comment to update."
  storage_mode:
    description:
      "'share' when the instance mounts the owner's data share: the table has no
      volume columns and the volume inputs are ignored. Empty: the volume table."
    required: false
    default: ""
outputs:
  comment-id:
    description: "The id of the comment to update."
    value: ${{ steps.couc.outputs.comment-id }}
runs:
  using: "composite"
  steps:
    - name: Set comment status
      id: status
      shell: bash
      run: |
        # Share mode has no volume steps: they count as done.
        volume_steps_done=true
        if [[ "{{ inputs.storage_mode }}" != "share" ]]; then
          [[ "{{ inputs.create_volume }}" == "✅" && "{{ inputs.attach_volume }}" == "✅" ]] || volume_steps_done=false
        fi
        if [[ \
          "{{ inputs.create_ip }}" == "✅" && \
          "$volume_steps_done" == "true" && \
          "{{ inputs.create_instance }}" == "✅" && \
          "{{ inputs.associate_ip }}" == "✅" && \
          "{{ inputs.setup_instance }}" == "✅" && \
          "{{ inputs.send_email }}" == "✅" \
          ]]; then
          value="✅"
        else
          value="⏳"
        fi
        echo "value=$value" >> $GITHUB_OUTPUT

    - name: Render template
      id: template
      uses: chuhlomin/render-template@a7c644e341797d050d1cb24332d83791b9a46dae # v1
      with:
        template:
          ${{ inputs.storage_mode == 'share' &&
          '.github/instance-creation-progress-template-share.md' ||
          '.github/instance-creation-progress-template.md' }}
        vars: |
          details_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          create_ip: ${{ inputs.create_ip }}
          create_volume: ${{ inputs.create_volume }}
          create_instance: ${{ inputs.create_instance }}
          associate_ip: ${{ inputs.associate_ip }}
          setup_instance: ${{ inputs.setup_instance }}
          attach_volume: ${{ inputs.attach_volume }}
          send_email: ${{ inputs.send_email }}
          status: ${{ steps.status.outputs.value }}

    - name: Set comment edit-mode
      id: edit-mode
      shell: bash
      run: |
        if [[ "{{ inputs.comment-id }}" != "" ]]; then
          value="replace"
        else
          value="append"
        fi
        echo "value=$value" >> $GITHUB_OUTPUT

    - name: comment (progress)
      id: couc
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ inputs.comment-id }}
        issue-number: ${{ inputs.issue-number }}
        body: ${{ steps.template.outputs.result }}
        edit-mode: ${{ steps.edit-mode.outputs.value }}
