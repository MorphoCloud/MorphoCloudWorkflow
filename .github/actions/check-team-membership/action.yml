name: "Check team membership"
description: "Check if a GitHub user is a member of an organization team"
inputs:
  token:
    description: "GitHub token with read:org scope (e.g., GitHub App token)"
    required: true
  org:
    description: "GitHub organization name"
    required: true
  team_slug:
    description: "Team slug to check membership against"
    required: true
  username:
    description: "GitHub username to check"
    required: true
outputs:
  is_member:
    description:
      "'true' if the user is an active member, 'false' if GitHub definitively
      answered that they are not (404, or a pending invitation), 'unknown' if
      GitHub could not answer (5xx, rate limit, network). Callers MUST treat
      'unknown' as inconclusive — never as a rejection: an API outage must not
      be reported to the user as a membership verdict (Instances#205)."
    value: ${{ steps.check.outputs.is_member }}
  http_code:
    description: "HTTP status code returned by the membership API call"
    value: ${{ steps.check.outputs.http_code }}
runs:
  using: "composite"
  steps:
    - name: Check team membership
      id: check
      shell: bash
      run: |
        echo "Checking if '$USERNAME' is a member of '$ORG/teams/$TEAM_SLUG'"

        HTTP_CODE=$(curl -s --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/membership_response.json -w "%{http_code}" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/orgs/$ORG/teams/$TEAM_SLUG/memberships/$USERNAME")

        echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

        # Only two answers are definitive: 200 (member record exists; active
        # or pending) and 404 (documented "not a member" response). Anything
        # else is GitHub failing to answer, not the user failing the check.
        if [[ "$HTTP_CODE" == "200" ]]; then
          STATE=$(jq -r '.state' /tmp/membership_response.json)
          if [[ "$STATE" == "active" ]]; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            echo "User '$USERNAME' is an active member of '$ORG/teams/$TEAM_SLUG'"
          else
            echo "is_member=false" >> $GITHUB_OUTPUT
            echo "User '$USERNAME' has state '$STATE' in '$ORG/teams/$TEAM_SLUG' (not active)"
          fi
        elif [[ "$HTTP_CODE" == "404" ]]; then
          echo "is_member=false" >> $GITHUB_OUTPUT
          echo "User '$USERNAME' is not a member of '$ORG/teams/$TEAM_SLUG' (HTTP 404)"
        else
          echo "is_member=unknown" >> $GITHUB_OUTPUT
          echo "::warning::Could not verify membership of '$USERNAME' in '$ORG/teams/$TEAM_SLUG': GitHub API returned HTTP $HTTP_CODE"
        fi

        rm -f /tmp/membership_response.json
      env:
        TOKEN: ${{ inputs.token }}
        ORG: ${{ inputs.org }}
        TEAM_SLUG: ${{ inputs.team_slug }}
        USERNAME: ${{ inputs.username }}
