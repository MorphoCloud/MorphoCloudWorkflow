name: "Setup Instance"
description:
  "Post-ACTIVE setup tail (split out of create-instance so it can run on the
  control runner): wait for cloud-init, attach + populate the data volume,
  relocate the home directory, reboot, and mark the instance ready. All instance
  facts come in as inputs from the acquire job."
inputs:
  os_cloud:
    description:
      "Name of the OpenStack cloud allocation to select openstack auth settings
      defined in '.config/openstack/clouds.yaml'"
    required: true
  issue_number:
    description: "Issue number"
    required: true
  token:
    description: "GITHUB_TOKEN or repo scoped PAT"
    required: true
  instance_name:
    description: "Name of the instance (from the acquire job)"
    required: true
  volume_name:
    description: "Name of the data volume (from the acquire job)"
    required: true
  instance_ip:
    description: "Floating IP of the instance (from the acquire job)"
    required: true
  progress_comment_id:
    description:
      "GitHub comment ID for the progress tracking comment (from the acquire
      job)"
    required: true
  storage_mode:
    description:
      "'share' to mount the owner's data share instead of the volume (phase 2
      prototype, Test-Instances only); empty for the volume path"
    required: false
    default: ""
  github_id:
    description: "Numeric GitHub ID of the instance owner (share mode)"
    required: false
    default: ""
  github_login:
    description: "GitHub login of the instance owner (share mode)"
    required: false
    default: ""
outputs:
  setup_status:
    description: "Instance setup status ('complete' when ready)"
    value: ${{ steps.instance_poll.outputs.status }}
runs:
  using: "composite"
  steps:
    - name: Poll instance setup status
      id: instance_poll
      shell: bash
      run: |
        source ~/venv/bin/activate

        echo Polling "$INSTANCE_NAME" setup status

        max_wait_time=1200  # Maximum wall-clock wait time in seconds (1200s -> 20mins)
        wait_interval=5    # Interval between status checks in seconds
        start_time=$SECONDS
        status="pending"

        # Emit a multi-line-safe failure_detail output. The heredoc delimiter is
        # chosen so it cannot collide with an ansible task/extension name or any
        # console line (a bare "EOF" line would otherwise truncate the value).
        set_failure_detail() {
          { printf 'failure_detail<<FAILURE_DETAIL_EOF\n%s\nFAILURE_DETAIL_EOF\n' "$1"; } >> "$GITHUB_OUTPUT"
        }
        # Last ansible 'TASK [...]' name seen in the console (ANSI-stripped).
        last_ansible_task() {
          printf '%s\n' "$1" | sed -E 's/\x1b\[[0-9;]*m//g' \
            | grep -oE 'TASK \[[^]]+\]' | tail -1 | sed -E 's/^TASK \[//; s/\]$//'
        }

        while (( SECONDS - start_time < max_wait_time )); do

            # Get the log; bail if openstack itself fails
            log_output=$(openstack console log show "$INSTANCE_NAME") || {
              set_failure_detail "setup status could not be read: the instance console log could not be fetched (OpenStack error)"
              echo "::error ::failed to fetch console log for $INSTANCE_NAME"
              exit 1
            }

            # Extract the last {"status":"..."} line; default to pending if none
            status_line=$(printf '%s\n' "$log_output" | grep -E '^\{"status":"' || true)
            status=$(
              { [ -n "$status_line" ] && printf '%s\n' "$status_line" | tail -n1 || echo '{"status":"pending"}'; } \
              | jq -r '.status // "pending"'
            )

            echo -n "setup status [$status] (waited $((SECONDS - start_time))s). "

            if [[ "$status" == "complete" ]]; then
                echo "Setup complete."
                break
            elif [[ "$status" == "error" ]]; then
                # A failure raised before/outside ansible (no outbound network, a
                # missing precondition, an incomplete checkout) carries an
                # explicit reason. Prefer it: those failures happen with no
                # ansible task on the console, so the task-name path below would
                # report `unknown`, or -- after a mid-clone drop -- a real task
                # name that misattributes a network fault to an ansible bug.
                reason=$(printf '%s\n' "$status_line" | tail -n1 | jq -r '.reason // empty' || true)
                if [ -n "$reason" ]; then
                    detail="setup FAILED: $reason"
                else
                    # Real setup failure. Extract the failed ansible task (and loop
                    # item, e.g. the extension name) from the console so the comment
                    # says exactly where it failed -- not a generic timeout message.
                    failed_task=$(last_ansible_task "$log_output")
                    failed_item=$(printf '%s\n' "$log_output" | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E 'failed:' | grep -oE '\(item=[^)]+\)' | tail -1 | sed -E 's/^\(item=//; s/\)$//')
                    detail="setup FAILED at ansible task \`${failed_task:-unknown}\`"
                    if [ -n "$failed_item" ]; then detail="$detail (item \`$failed_item\`)"; fi
                fi
                set_failure_detail "$detail"
                echo "::error ::$detail"
                exit 1
            else
                echo "Waiting for completion..."
                sleep $wait_interval
            fi
        done

        if [[ "$status" != "complete" ]]; then
            last_task=$(last_ansible_task "$log_output")
            detail="setup did NOT finish within ${max_wait_time}s (timed out); last task seen was \`${last_task:-unknown}\`"
            set_failure_detail "$detail"
            echo "::error ::$detail"
            exit 1
        fi

        # Setup completed. Surface any extensions that failed to install but were
        # skipped (non-fatal). The completion status line carries the list, so it
        # arrives as reliably as the "complete" signal itself; warn on the issue.
        ext_failed=$(printf '%s\n' "$status_line" | tail -n1 | jq -r '.failed_extensions // empty')
        if [ -n "$ext_failed" ]; then
            { echo "extensions_warning<<EXT_WARNING_EOF"; echo "$ext_failed"; echo "EXT_WARNING_EOF"; } >> "$GITHUB_OUTPUT"
        fi

        # Explicitly set status to "complete"
        exoSetup='{"status":"complete", "epoch": '$(date '+%s')'000}'

        openstack server set \
            --property "exoSetup=$exoSetup" \
          $INSTANCE_NAME

        echo "status=$status" >> $GITHUB_OUTPUT
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}
        INSTANCE_NAME: ${{ inputs.instance_name }}

    - name: comment (setup failed)
      if: ${{ steps.instance_poll.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Instance **${{ inputs.instance_name }}** ${{ steps.instance_poll.outputs.failure_detail || 'setup failed' }}.

          @MorphoCloud/morphocloud-admins — please check the failed step in the console log of the linked run.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: comment (extensions skipped, setup completed)
      if:
        ${{ success() && steps.instance_poll.outputs.extensions_warning != '' }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation: extensions skipped ⚠️

          Instance **${{ inputs.instance_name }}** finished provisioning, but the following Slicer extension(s) failed to install and were skipped: **${{ steps.instance_poll.outputs.extensions_warning }}**.

          The instance is usable; only the listed extension(s) are missing — usually a server-side packaging issue on the Slicer extensions catalog. @MorphoCloud/morphocloud-admins — please investigate.

    - name: comment (progress)
      uses: ./.github/actions/comment-progress
      with:
        comment-id: ${{ inputs.progress_comment_id }}
        create_ip: ✅
        create_volume: ✅
        create_instance: ✅
        associate_ip: ✅
        setup_instance: ✅
        attach_volume: ⏳
        send_email: ""

    # Share mode (STORAGE_REDESIGN_PLAN.md, phase 2 prototype; Test-Instances
    # only): the owner's per-user share replaces the MyData volume. The
    # volume steps below are skipped; this mounts the share at
    # /media/share/MyDrive and links the home folders into it. Home, Slicer and
    # settings stay on the root disk.
    - name: Mount the owner's data share
      id: mount_share
      if: ${{ inputs.storage_mode == 'share' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! [[ "$GITHUB_ID" =~ ^[0-9]{1,12}$ ]]; then
          echo "::error ::No numeric GitHub ID for the instance owner"
          exit 1
        fi
        ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
                  -o ConnectTimeout=10 -o LogLevel=ERROR)

        # Wait for sshd, as the volume path's rename step does: right after
        # setup the instance may still be finishing cloud-init.
        start=$SECONDS
        until out=$(ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" true 2>&1); do
          if grep -qi "permission denied" <<<"$out"; then
            echo "::error ::SSH auth rejected by $INSTANCE_IP"
            exit 1
          fi
          if (( SECONDS - start >= 300 )); then
            echo "::error ::sshd on $INSTANCE_IP not reachable after 300s"
            exit 1
          fi
          sleep 15
        done

        # The same fail-closed ensure as the data portal (never a second
        # share, never deletes), under the same lock as the portal pickup.
        source ~/venv/bin/activate
        if ! details=$(python3 "$HOME/mc-data/mc_share_runner.py" ensure "$GITHUB_ID" "$GITHUB_LOGIN"); then
          echo "::error ::Could not create or find the data share for $GITHUB_LOGIN ($GITHUB_ID)"
          exit 1
        fi
        key=$(jq -r '.access_key // empty' <<<"$details")
        if [[ -z "$key" ]]; then
          echo "::error ::The data share has no access key"
          exit 1
        fi
        echo "::add-mask::$key"
        export_path=$(jq -r '.export_path // empty' <<<"$details")
        access_to=$(jq -r '.access_to // empty' <<<"$details")
        if ! [[ "$export_path" =~ ^[0-9.:,]+:/volumes/_nogroup/[0-9a-f-]+/[0-9a-f-]+$ ]] \
            || ! [[ "$access_to" =~ ^mc-[a-z0-9]+-u${GITHUB_ID}$ ]]; then
          echo "::error ::Unexpected share details for $GITHUB_ID"
          exit 1
        fi
        echo "Share for $GITHUB_LOGIN ($GITHUB_ID): $(jq -r .share_id <<<"$details")"

        # The key goes over stdin, never on a command line.
        printf '%s' "$key" | ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" \
          "sudo install -d -m 0755 /etc/ceph && sudo sh -c 'umask 077; cat > /etc/ceph/mc-user.secret'"

        # The values travel in the script body (quoted with %q), never on the
        # remote command line.
        { printf 'EXPORT=%q\nNAME=%q\n' "$export_path" "$access_to"
          cat <<'EOF'
        set -euo pipefail
        MP=/media/share/MyDrive
        UNIT=media-share-MyDrive.mount
        H=/home/exouser
        # No Uploads folder: the data portal uploads into any folder.
        FOLDERS="Desktop Documents Downloads"

        # Bare mountpoint is immutable: nothing lands on the root disk while
        # the share is not mounted.
        if ! mountpoint -q "$MP"; then
          mkdir -p "$MP"
          if [ -n "$(ls -A "$MP")" ]; then
            echo "$MP is not empty while unmounted; refusing" >&2
            exit 1
          fi
          chattr +i "$MP"
        fi

        cat > "/etc/systemd/system/$UNIT" <<UNITEOF
        [Unit]
        Description=MorphoCloud user storage
        After=network-online.target
        Wants=network-online.target

        [Mount]
        What=$EXPORT
        Where=$MP
        Type=ceph
        Options=name=$NAME,secretfile=/etc/ceph/mc-user.secret,noatime,_netdev
        TimeoutSec=90

        [Install]
        WantedBy=remote-fs.target
        UNITEOF
        systemctl daemon-reload
        systemctl enable --now "$UNIT"

        # Prove it is this user's share, not something else at that path.
        read -r src fstype < <(findmnt -n -o SOURCE,FSTYPE "$MP")
        if [ "$fstype" != "ceph" ] || [ "${src#*:}" != "${EXPORT#*:}" ]; then
          echo "$MP is not the expected share ($fstype $src)" >&2
          exit 1
        fi

        chown exouser:exouser "$MP"
        for d in $FOLDERS; do
          [ -e "$MP/$d" ] || install -d -o exouser -g exouser "$MP/$d"
        done

        # Launchers written by setup into the local Desktop: refresh them on
        # the share, then drop the local copies.
        if [ -d "$H/Desktop" ] && [ ! -L "$H/Desktop" ]; then
          for f in "$H"/Desktop/*.desktop; do
            [ -e "$f" ] || continue
            install -o exouser -g exouser -m 0755 "$f" "$MP/Desktop/"
            rm -f "$f"
          done
        fi

        # Home folders become links to the share. Anything left in a local
        # folder is moved aside, never deleted.
        stamp=$(date +%Y%m%d-%H%M%S)
        for d in $FOLDERS; do
          p="$H/$d"
          if [ -L "$p" ]; then
            [ "$(readlink "$p")" = "$MP/$d" ] && continue
            rm -f "$p"
          elif [ -d "$p" ] && [ -z "$(ls -A "$p")" ]; then
            rmdir "$p"
          elif [ -e "$p" ]; then
            mv "$p" "$H/$d.local-$stamp"
          fi
          ln -s "$MP/$d" "$p"
          chown -h exouser:exouser "$p"
        done

        # No desktop without the share: a local fallback Desktop would hold
        # work that disappears with the instance.
        install -d /etc/systemd/system/vncserver@1.service.d
        cat > /etc/systemd/system/vncserver@1.service.d/mc-share.conf <<VNCEOF
        [Unit]
        Requires=$UNIT
        After=$UNIT
        VNCEOF
        systemctl daemon-reload

        # A late or failed mount must never reset the folders to local ones.
        if grep -q '^enabled=' /etc/xdg/user-dirs.conf 2>/dev/null; then
          sed -i 's/^enabled=.*/enabled=False/' /etc/xdg/user-dirs.conf
        else
          echo 'enabled=False' >> /etc/xdg/user-dirs.conf
        fi
        echo "Share mounted at $MP; home folders linked."
        EOF
        } | ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" 'sudo bash -s'
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}
        GITHUB_ID: ${{ inputs.github_id }}
        GITHUB_LOGIN: ${{ inputs.github_login }}
        OS_CLOUD: ${{ inputs.os_cloud }}

    - name: comment (failed to mount the data share)
      if: ${{ steps.mount_share.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to mount the data share on instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Rename MyData directory to MyData-tmp
      id: rename_mydata
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        # This is the first SSH-to-instance step of the volume phase. Right
        # after 'setup_instance' completes the instance can still be finishing
        # cloud-init or rebooting, so sshd is briefly unreachable and ssh exits
        # 255 (a transient, not an 'mv' error). Previously that aborted the run
        # and forced the user to /delete_all + /create. Instead, wait for sshd
        # to come back on a real-elapsed-time budget and retry. The remote
        # command is idempotent: if a connection drops *after* the mv applied,
        # MyData-tmp already exists on the next attempt and we treat it as done.
        # This loop also gates the later instance-SSH steps (copy/relocate),
        # since by the time it succeeds the instance is reachable and stable.
        remote_cmd='if [ -e /media/volume/MyData-tmp ]; then
          echo "MyData-tmp already present; rename already applied.";
        elif [ -e /media/volume/MyData ]; then
          mv /media/volume/MyData /media/volume/MyData-tmp;
        else
          echo "Neither MyData nor MyData-tmp present on the volume mount" >&2;
          exit 3;
        fi'
        max_wait=300
        interval=15
        start=$SECONDS
        attempt=0
        while :; do
          attempt=$((attempt + 1))
          echo "Rename attempt $attempt (elapsed $((SECONDS - start))s of ${max_wait}s)"
          set +e
          out=$(ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o LogLevel=ERROR \
            exouser@"$INSTANCE_IP" \
            "$remote_cmd" 2>&1)
          rc=$?
          set -e
          [[ -n "$out" ]] && echo "$out"
          if [[ $rc -eq 0 ]]; then
            echo "Rename succeeded (or already applied)."
            break
          fi
          if [[ $rc -ne 255 ]]; then
            echo "::error ::Remote rename command failed (ssh rc=$rc) — not a connection error; aborting."
            exit 1
          fi
          # rc=255 is both transient connection errors (retry) AND SSH auth
          # rejection (permanent — retrying 300s is pointless). Fail fast on auth.
          if grep -qi "permission denied" <<<"$out"; then
            echo "::error ::SSH auth rejected by $INSTANCE_IP — the runner's key is not authorized on the instance. Confirm ~/.ssh/id_ed25519 exists on the runner (injected into the instance via cloud-config) and that the instance booted with it."
            exit 1
          fi
          if (( SECONDS - start >= max_wait )); then
            echo "::error ::sshd on $INSTANCE_IP not reachable for rename after ${max_wait}s"
            exit 1
          fi
          echo "ssh not ready yet (connection error, rc=255); retrying in ${interval}s..."
          sleep "$interval"
        done
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (failed to rename MyData)
      if: ${{ steps.rename_mydata.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to rename `/media/volume/MyData` to `/media/volume/MyData-tmp` for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Attach Volume
      id: attach_volume
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        source ~/venv/bin/activate

        instance_id=$(openstack server list -f json | \
          jq \
          --arg instance_name "$INSTANCE_NAME" \
          -c '.[] | select(.Name == $instance_name)' | \
          jq -r '.ID' | tail -1)
        echo "instance_id [$instance_id]"

        volume_id=$(openstack volume list -f json | \
          jq \
          --arg volume_name "$VOLUME_NAME" \
          -c '.[] | select(.Name == $volume_name)' | \
          jq -r '.ID' | tail -1)
        echo "volume_id [$volume_id]"

        # Self-heal a volume stuck in 'reserved' from a prior failed/incomplete
        # attach -- e.g. when a wedged instance was deleted without a clean
        # detach, Cinder can leave a dangling attachment that pins the volume.
        # That reservation blocks 'server add volume' with HTTP 400 "status must
        # be available". Clear any dangling attachment so the volume returns to
        # 'available' before we attach. An 'in-use' volume is deliberately left
        # alone -- that's a real conflict (attached elsewhere), not a stuck
        # reservation. Note: 'volume show' does not list a dangling reservation,
        # so we query 'volume attachment list'.
        vol_status=$(openstack volume show "$volume_id" -c status -f value)
        if [[ "$vol_status" == "reserved" ]]; then
          echo "::warning ::Volume $volume_id is stuck in 'reserved'; clearing dangling attachment(s)."
          att_list=$(openstack volume attachment list -f json | \
            jq -r --arg v "$volume_id" '.[] | select(.["Volume ID"] == $v) | .ID') \
            || { echo "::warning ::Failed to list volume attachments; skipping self-heal."; att_list=""; }
          for att in $att_list; do
            echo "Deleting dangling attachment $att"
            openstack volume attachment delete "$att" \
              || echo "::warning ::Failed to delete attachment $att (may already be gone)"
          done
          for i in $(seq 1 12); do
            vol_status=$(openstack volume show "$volume_id" -c status -f value)
            echo "volume status after cleanup attempt $i: $vol_status"
            [[ "$vol_status" == "available" ]] && break
            sleep 5
          done
          if [[ "$vol_status" != "available" ]]; then
            echo "::error ::Volume $volume_id is still in '$vol_status' after cleanup; giving up on self-heal."
            exit 1
          fi
        fi

        openstack server set \
          --property "exoVolumes::$volume_id={\"name\":\"MyData\"}" \
          $instance_id

        openstack server add volume \
          $instance_id \
          $volume_id
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}
        INSTANCE_NAME: ${{ inputs.instance_name }}
        VOLUME_NAME: ${{ inputs.volume_name }}

    - name: comment (failed to attach volume)
      if: ${{ steps.attach_volume.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to attach volume **${{ inputs.volume_name }}** to instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Copy installed files into attached volume
      id: copy_installed_files
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        function check_mountpoint_ready {
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            exouser@$INSTANCE_IP \
            'mountpoint -q /media/volume/MyData'
        }
        set +e
        max_attempts=5
        for attempt in $(seq 1 $max_attempts); do
          echo "Checking if mount point is ready ($attempt/$max_attempts)"
          check_mountpoint_ready
          if check_mountpoint_ready; then
            echo "Mount point /media/volume/MyData is ready."
            break
          else
            echo "Mount point not ready. Retrying in 5 seconds..."
            sleep 5
          fi
        done
        if ! check_mountpoint_ready; then
          echo "::error ::Mount point /media/volume/MyData not ready after $((max_attempts * 5)) seconds."
          exit 1
        fi
        set -e
        ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          exouser@$INSTANCE_IP \
          '[ ! -d /media/volume/MyData/Slicer ] && mv /media/volume/MyData-tmp/Slicer /media/volume/MyData/Slicer && rmdir /media/volume/MyData-tmp || rm -rf /media/volume/MyData-tmp'
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (failed to copy installed files from MyData-tmp to MyData)
      if: ${{ steps.copy_installed_files.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to copy installed files from `/media/volume/MyData-tmp` to `/media/volume/MyData` for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Relocate home directory to persistent volume
      id: relocate_home_directory
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          exouser@$INSTANCE_IP \
          'bash -s' << 'EOF'
        VOLUME_HOME=/media/volume/MyData/home/exouser
        set -e
        sudo mkdir -p "$(dirname "$VOLUME_HOME")"
        sudo chown exouser:exouser "$(dirname "$VOLUME_HOME")"

        if [ ! -d "$VOLUME_HOME" ]; then
            # First-time create: seed volume home from the freshly provisioned home
            # Exclude .cache — it will be redirected to the ephemeral root disk
            sudo rsync -a --exclude='.cache' /home/exouser/ "$VOLUME_HOME/"
            sudo chmod 700 "$VOLUME_HOME"
            echo "Home directory copied to volume (first create)"
        else
            echo "Existing home directory found on volume — preserving user data"

            # Clean up ephemeral session files from the previous (now-dead) instance.
            # These carry stale hostnames, PIDs, and X11 cookies that can break
            # GNOME/VNC on the new instance.
            sudo rm -f "$VOLUME_HOME/.Xauthority" "$VOLUME_HOME/.ICEauthority"
            sudo rm -f "$VOLUME_HOME/.vnc/"*.pid "$VOLUME_HOME/.vnc/"*.log
            sudo rm -rf "$VOLUME_HOME/.cache/sessions"
            sudo rm -rf "$VOLUME_HOME/.dbus"
        fi

        # Always refresh SSH authorized_keys from cloud-init
        # (guards against runner key rotation or accidental user deletion)
        sudo mkdir -p "$VOLUME_HOME/.ssh"
        sudo cp /home/exouser/.ssh/authorized_keys "$VOLUME_HOME/.ssh/authorized_keys"
        sudo chown exouser:exouser "$VOLUME_HOME/.ssh" "$VOLUME_HOME/.ssh/authorized_keys"
        sudo chmod 700 "$VOLUME_HOME/.ssh"
        sudo chmod 600 "$VOLUME_HOME/.ssh/authorized_keys"

        # Always refresh VNC password from cloud-init (new password generated each provision).
        # Without this the volume retains the old password and VNC/Guacamole auth fails.
        if [ -f /home/exouser/.vnc/passwd ]; then
          sudo mkdir -p "$VOLUME_HOME/.vnc"
          sudo cp /home/exouser/.vnc/passwd "$VOLUME_HOME/.vnc/passwd"
          sudo chown exouser:exouser "$VOLUME_HOME/.vnc/passwd"
          sudo chmod 600 "$VOLUME_HOME/.vnc/passwd"
        fi

        # Redirect ~/.cache to the ephemeral root disk so browser/app caches
        # don't consume the user's persistent volume quota.
        sudo mkdir -p /var/cache/exouser
        sudo chown exouser:exouser /var/cache/exouser
        sudo rm -rf "$VOLUME_HOME/.cache"
        sudo ln -sfn /var/cache/exouser "$VOLUME_HOME/.cache"

        # Update passwd entry.
        # usermod may fail if exouser processes are already running (GDM, VNC, etc.),
        # so fall back to direct /etc/passwd edit.
        sudo usermod -d "$VOLUME_HOME" exouser 2>/dev/null \
          || sudo sed -i "s|^\(exouser:[^:]*:[^:]*:[^:]*:[^:]*:\)/home/exouser:|\1${VOLUME_HOME}:|" /etc/passwd

        # Replace original home with symlink (atomic swap to avoid a broken state)
        sudo mv /home/exouser /home/exouser.bak
        sudo ln -sfn "$VOLUME_HOME" /home/exouser
        sudo rm -rf /home/exouser.bak
        EOF
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (failed to relocate home directory to persistent volume)
      if: ${{ steps.relocate_home_directory.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to relocate `/home/exouser` to `/media/volume/MyData/home/exouser` for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    # Landing folder for the drop zone (exosphere roles/dropzone) plus a
    # desktop shortcut. Both live on the volume, so they persist like the rest
    # of the home directory. Idempotent for re-attached volumes.
    - name: Create Uploads folder and desktop shortcut
      id: create_uploads_folder
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          exouser@$INSTANCE_IP \
          'mkdir -p /media/volume/MyData/Uploads /home/exouser/Desktop && ln -sfn /media/volume/MyData/Uploads /home/exouser/Desktop/Uploads'
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (failed to create Uploads folder)
      if: ${{ steps.create_uploads_folder.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to create `/media/volume/MyData/Uploads` for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Create Renviron file
      id: create_renviron_file
      if: ${{ inputs.storage_mode != 'share' }}
      shell: bash
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          exouser@$INSTANCE_IP \
          'echo -e "R_LIBS_SITE=/media/share/MorphoCloudCephShare/R/x86_64-pc-linux-gnu-library/4.4/\nR_LIBS_USER=/media/volume/MyData/R/x86_64-pc-linux-gnu-library/4.4/" > /home/exouser/.Renviron && mkdir -p /media/volume/MyData/R/x86_64-pc-linux-gnu-library/4.4/'
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (failed to create /home/exouser/.Renviron)
      if: ${{ steps.create_renviron_file.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to create `/home/exouser/.Renviron` file for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Reboot instance
      id: reboot_instance
      shell: bash
      run: |
        set +e

        ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o LogLevel=ERROR \
          exouser@$INSTANCE_IP \
          'sudo shutdown -r now'

        sleep 10
        function check_instance_ready {
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            exouser@$INSTANCE_IP \
            'true'
        }

        max_attempts=3
        instance_ready=false
        for attempt in $(seq 1 $max_attempts); do
          echo "Checking if instance is ready ($attempt/$max_attempts)"
          if check_instance_ready; then
            instance_ready=true
            echo "Instance '$INSTANCE_NAME' is ready."
            break
          else
            echo "Instance '$INSTANCE_NAME' is not ready. Retrying in 5 seconds..."
            sleep 10
          fi
        done
        if ! $instance_ready; then
          echo "::error ::Instance '$INSTANCE_NAME' is not ready after $max_attempts attempts to connect."
          exit 1
        fi
        set -e
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}
        INSTANCE_NAME: ${{ inputs.instance_name }}

    - name: comment (failed to reboot instance)
      if: ${{ steps.reboot_instance.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to reboot instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    # Share mode: after the reboot the share must mount on its own and the
    # desktop must start on it; this is what every unshelve relies on.
    - name: Verify the data share after reboot
      id: verify_share
      if: ${{ inputs.storage_mode == 'share' }}
      shell: bash
      run: |
        ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
                  -o ConnectTimeout=10 -o LogLevel=ERROR)
        # Wait for sshd first (up to 300 s, like the rename step), so a slow
        # boot is not mistaken for a missing share.
        start=$SECONDS
        until out=$(ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" true 2>&1); do
          if grep -qi "permission denied" <<<"$out"; then
            echo "::error ::SSH auth rejected by $INSTANCE_IP after the reboot"
            exit 1
          fi
          if (( SECONDS - start >= 300 )); then
            echo "::error ::sshd on $INSTANCE_IP not reachable after the reboot (300s)"
            exit 1
          fi
          sleep 10
        done
        check='mountpoint -q /media/share/MyDrive &&
          [ "$(readlink /home/exouser/Desktop)" = /media/share/MyDrive/Desktop ] &&
          systemctl is-active --quiet vncserver@1'
        for attempt in $(seq 1 12); do
          if ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" "$check"; then
            echo "Share mounted, Desktop linked, desktop session running."
            exit 0
          fi
          sleep 10
        done
        ssh "${ssh_opts[@]}" exouser@"$INSTANCE_IP" \
          'systemctl --no-pager status media-share-MyDrive.mount vncserver@1 | tail -30' || true
        echo "::error ::The data share or the desktop did not come up after the reboot"
        exit 1
      env:
        INSTANCE_IP: ${{ inputs.instance_ip }}

    - name: comment (data share not up after reboot)
      if: ${{ steps.verify_share.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          The data share or the desktop did not come up after rebooting **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Set instance properties
      id: set_instance_properties
      shell: bash
      run: |
        source ~/venv/bin/activate

        # Explicitly set status to complete
        exoSetup='{"status":"complete", "epoch": '$(date '+%s')'000}'

        openstack server set \
            --property "exoSetup=$exoSetup" \
          $INSTANCE_NAME
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}
        INSTANCE_NAME: ${{ inputs.instance_name }}

    - name: comment (failed to set instance properties)
      if: ${{ steps.set_instance_properties.outcome == 'failure' && failure() }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to set instance **${{ inputs.instance_name }}** properties.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Update Request Status Label
      id: update-request-status-label
      uses: ./.github/actions/update-request-status-label
      with:
        os_cloud: ${{ inputs.os_cloud }}
        token: ${{ inputs.token }}
        instance_name: ${{ inputs.instance_name }}
        issue_number: ${{ inputs.issue_number }}

    - name: comment (failed to update request status label)
      if:
        ${{ steps.update-request-status-label.outcome == 'failure' && failure()
        }}
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        issue-number: ${{ inputs.issue_number }}
        body: |
          ### Instance Creation Results ❌

          Failed to update request status label for instance **${{ inputs.instance_name }}**.

          See details at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: comment (progress)
      uses: ./.github/actions/comment-progress
      with:
        comment-id: ${{ inputs.progress_comment_id }}
        create_ip: ✅
        create_volume: ✅
        create_instance: ✅
        associate_ip: ✅
        setup_instance: ✅
        attach_volume: ✅
        send_email: ⏳
