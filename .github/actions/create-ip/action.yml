name: "Retrieve or create floating IP"
description: "Retrieve or create floating IP"
inputs:
  os_cloud:
    description:
      "Name of the OpenStack cloud allocation to select openstack auth settings
      defined in '.config/openstack/clouds.yaml'"
    required: true
  preferred_ip_address:
    description: "If already created and unassigned, IP address to return"
outputs:
  floating_ip_address:
    description: "Retrieved or created floating IP address"
    value: ${{ steps.define_output.outputs.floating_ip_address }}
  floating_ip_uuid:
    description: "Retrieved or created floating IP UUID"
    value: ${{ steps.define_output.outputs.floating_ip_uuid }}
runs:
  using: "composite"
  steps:
    - name: "Retrieve unassigned floating IP"
      id: ip_retrieve_unassigned
      shell: bash
      run: |
        source ~/venv/bin/activate

        # Only a routable address counts (INSTANCE_DASHBOARD_PLAN.md decision
        # 24): under exhaustion Jetstream2 hands out 172.17.x, which does not
        # route, and an instance on one is "Active" and dead (Test-Instances
        # #513, 2026-11-02). Unattached non-routable ones are deleted here.
        all_unassigned=$(openstack floating ip list -f json | jq 'map(select(.Port == null))')
        while IFS= read -r bad; do
          [[ -n "$bad" ]] || continue
          echo "Deleting unattached non-routable floating IP $bad"
          openstack floating ip delete "$bad" || echo "::warning ::Could not delete non-routable floating IP $bad"
        done < <(echo "$all_unassigned" | jq -r 'map(select(."Floating IP Address" | startswith("149.165.") | not)) | .[].ID')
        json_output=$(echo "$all_unassigned" | jq 'map(select(."Floating IP Address" | startswith("149.165.")))')
        echo "Filtered JSON Output:"
        echo "$json_output" | jq

        if [[ -n "${{ inputs.preferred_ip_address }}" ]]; then
          floating_ip=$(echo "$json_output" | jq -r --arg ip "${{ inputs.preferred_ip_address }}" \
            'map(select(."Floating IP Address" == $ip)) | if length > 0 then .[0] else null end')
        else
          floating_ip=$(echo "$json_output" | jq -r 'if length > 0 then .[0] else null end')
        fi

        floating_ip_address=$(echo "$floating_ip" | jq -r '."Floating IP Address" // empty')
        floating_ip_uuid=$(echo "$floating_ip" | jq -r '."ID" // empty')

        echo "floating_ip_address [$floating_ip_address]"
        echo "floating_ip_address=$floating_ip_address" >> $GITHUB_OUTPUT

        echo "floating_ip_uuid [$floating_ip_uuid]"
        echo "floating_ip_uuid=$floating_ip_uuid" >> $GITHUB_OUTPUT
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}

    - name: "Create floating IP"
      if: ${{ steps.ip_retrieve_unassigned.outputs.floating_ip_address == '' }}
      id: ip_create
      shell: bash
      run: |
        source ~/venv/bin/activate

        # Nothing in hand: mint, and refuse a non-routable address (decision
        # 24). Two tries, then fail fast with the real reason, so the member
        # is told "no address available" instead of getting a dead instance.
        floating_ip_address=""
        floating_ip_uuid=""
        for attempt in 1 2; do
          if ! json_output=$(openstack floating ip create public --description MorphoCloud -f json); then
            echo "::warning ::floating ip create failed (attempt $attempt)"
            continue
          fi
          echo "Floating IP Creation Output:"
          echo "$json_output"
          address=$(echo "$json_output" | jq -r ".floating_ip_address")
          uuid=$(echo "$json_output" | jq -r ".id")
          if [[ "$address" == 149.165.* ]]; then
            floating_ip_address="$address"
            floating_ip_uuid="$uuid"
            break
          fi
          echo "::warning ::Jetstream2 handed out non-routable $address (attempt $attempt); deleting it"
          openstack floating ip delete "$uuid" || true
        done
        if [[ -z "$floating_ip_address" ]]; then
          echo "::error ::No routable floating IP available on Jetstream2: its public address pool is exhausted. Try again later."
          exit 1
        fi

        echo "floating_ip_uuid [$floating_ip_uuid]"
        echo "floating_ip_uuid=$floating_ip_uuid" >> $GITHUB_OUTPUT
        echo "floating_ip_address [$floating_ip_address]"
        echo "floating_ip_address=$floating_ip_address" >> $GITHUB_OUTPUT
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}

    - name: "Keep one in hand"
      # Decision 24: the project holds max(N, running + 1). Having taken an
      # address, leave one spare for the next create or unshelve; the
      # policing script on the runner's crontab is the backstop. A failed
      # mint here is a warning, not a failure: this instance has its address.
      # Only on the retrieve path, on purpose: when the pool was empty and
      # ip_create had to mint, Jetstream2 is already short, and a second
      # mint right away would take two from a dry pool; the crontab fills
      # the spare within five minutes once it can.
      if: ${{ steps.ip_retrieve_unassigned.outputs.floating_ip_address != '' }}
      shell: bash
      run: |
        source ~/venv/bin/activate
        taken="${{ steps.ip_retrieve_unassigned.outputs.floating_ip_uuid }}"
        spare=$(openstack floating ip list -f json \
          | jq --arg id "$taken" '[.[] | select(.Port == null and .ID != $id and (."Floating IP Address" | startswith("149.165.")))] | length')
        echo "routable spares left after this one: $spare"
        if [[ "$spare" -gt 0 ]]; then
          exit 0
        fi
        if json_output=$(openstack floating ip create public --description MorphoCloud -f json); then
          address=$(echo "$json_output" | jq -r ".floating_ip_address")
          if [[ "$address" == 149.165.* ]]; then
            echo "minted $address: one in hand for the next start"
          else
            echo "::warning ::Jetstream2 handed out non-routable $address for the spare; deleting it (its pool is dry)"
            openstack floating ip delete "$(echo "$json_output" | jq -r ".id")" || true
          fi
        else
          echo "::warning ::Could not mint a spare floating IP (Jetstream2 pool dry?); the policing script will keep trying"
        fi
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}

    - name: "Define output"
      id: define_output
      shell: bash
      run: |
        echo "RETRIEVED_FLOATING_IP_ADDRESS [$RETRIEVED_FLOATING_IP_ADDRESS]"
        echo "RETRIEVED_FLOATING_IP_UUID [$RETRIEVED_FLOATING_IP_UUID]"
        echo "CREATED_IP_ADDRESS [$CREATED_IP_ADDRESS]"
        echo "CREATED_IP_UUID [$CREATED_IP_UUID]"
        if [[ -n "$RETRIEVED_FLOATING_IP_ADDRESS" ]]; then
          echo "floating_ip_address=$RETRIEVED_FLOATING_IP_ADDRESS" >> $GITHUB_OUTPUT
          echo "floating_ip_uuid=$RETRIEVED_FLOATING_IP_UUID" >> $GITHUB_OUTPUT
        elif [[ -n "$CREATED_IP_ADDRESS" ]]; then
          echo "floating_ip_address=$CREATED_IP_ADDRESS" >> $GITHUB_OUTPUT
          echo "floating_ip_uuid=$CREATED_IP_UUID" >> $GITHUB_OUTPUT
        else
          echo "::error ::Failed to either retrieve or create a floating IP."
          exit 1
        fi
      env:
        RETRIEVED_FLOATING_IP_ADDRESS:
          ${{ steps.ip_retrieve_unassigned.outputs.floating_ip_address }}
        RETRIEVED_FLOATING_IP_UUID:
          ${{ steps.ip_retrieve_unassigned.outputs.floating_ip_uuid }}
        CREATED_IP_ADDRESS: ${{ steps.ip_create.outputs.floating_ip_address }}
        CREATED_IP_UUID: ${{ steps.ip_create.outputs.floating_ip_uuid }}
