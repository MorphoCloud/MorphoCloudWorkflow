name: "Check instance exists"
description: "Check instance exists"
inputs:
  os_cloud:
    description:
      "Name of the OpenStack cloud allocation to select openstack auth settings
      defined in '.config/openstack/clouds.yaml'"
    required: true
  instance_name:
    description: "Name of the instance"
    required: true
outputs:
  exists:
    description: "Set to 'true' or 'false'"
    value: ${{ steps.check_instance.outputs.exists }}
  status:
    description:
      "OpenStack status of the instance (ACTIVE, SHELVED_OFFLOADED, ERROR, …),
      or empty when it does not exist. Existence alone is not liveness — a
      shelved server is still listed."
    value: ${{ steps.check_instance.outputs.status }}
runs:
  using: "composite"
  steps:
    - name: Check instance exists
      id: check_instance
      shell: bash
      run: |
        source ~/venv/bin/activate

        # Filter server-side: '--name' is a Nova regex match, so anchor it.
        # An unfiltered listing is the heaviest Nova query and 504'd during a
        # transient JS2 API brownout (Instances#168); the exact-match jq below
        # stays as the authoritative check.
        servers=$(openstack server list --name "^${INSTANCE_NAME}$" -f json)

        instance=$(echo "$servers" | \
          jq -r --arg instance_name "$INSTANCE_NAME" \
            '[.[] | select(.Name == $instance_name)] | last | .Name // empty')

        # Existence is not liveness: a SHELVED_OFFLOADED server is still listed,
        # and its cached address record still shows the floating IP it held
        # before shelving even though that IP is back in the project pool.
        # Callers that hand out connection details must gate on this.
        status=$(echo "$servers" | \
          jq -r --arg instance_name "$INSTANCE_NAME" \
            '[.[] | select(.Name == $instance_name)] | last | .Status // empty')

        [[ $instance == "$INSTANCE_NAME" ]] && exists="true" || exists="false"

        echo "exists [$exists] status [$status]"
        echo "exists=$exists" >> $GITHUB_OUTPUT
        echo "status=$status" >> $GITHUB_OUTPUT
      env:
        OS_CLOUD: ${{ inputs.os_cloud }}
        INSTANCE_NAME: ${{ inputs.instance_name }}
