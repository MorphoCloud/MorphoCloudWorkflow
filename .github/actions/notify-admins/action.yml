name: "Notify admins"
description:
  "One email to the admins about an incident, with the diagnosis the caller
  wrote. A send that fails is never lost: the issue gets the admin-email-failed
  label and a comment, and reconcile-instances re-sends a catch-up once mail
  works (INSTANCE_DASHBOARD_PLAN.md decision 27)."
inputs:
  admin_emails:
    description:
      "Comma-separated admin addresses (MORPHOCLOUD_GITHUB_ADMIN_EMAILS)"
    required: true
  mail_server_username:
    description: "mail server username"
    required: true
  mail_server_password:
    description: "mail server password"
    required: true
  token:
    description:
      "Token with issues:write, for the label and comment when the send fails"
    required: true
  issue_number:
    description: "The request issue the incident belongs to"
    required: true
  subject:
    description: "Subject line; the repository name is prefixed"
    required: true
  body_file:
    description: "Path of a markdown body written by the caller"
    required: true
runs:
  using: "composite"
  steps:
    - name: Complete the body
      shell: bash
      run: |
        {
          cat "$BODY_FILE" 2>/dev/null || echo "(no diagnosis was written: see the run log)"
          printf '\n\nIssue:   https://github.com/%s/issues/%s\nRun log: https://github.com/%s/actions/runs/%s\n' \
            "$GH_REPO" "$ISSUE_NUMBER" "$GH_REPO" "$RUN_ID"
        } > /tmp/notify-admins-body.md
      env:
        BODY_FILE: ${{ inputs.body_file }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        RUN_ID: ${{ github.run_id }}

    - name: Send
      id: send
      if: ${{ inputs.admin_emails != '' }}
      # The incident is already in the run log and on the issue; a mail
      # outage must not replace it, so the step continues — and the next
      # step makes the outage visible and recoverable.
      continue-on-error: true
      uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
      with:
        server_address: webhost.dynadot.com
        server_port: 587
        secure: false
        username: ${{ inputs.mail_server_username }}
        password: ${{ inputs.mail_server_password }}
        from: MorphoCloudPortal <no-reply@morphocloud.org>
        to: ${{ inputs.admin_emails }}
        subject: "[${{ github.repository }}] ${{ inputs.subject }}"
        body: file:///tmp/notify-admins-body.md

    - name: Keep the undelivered notification
      if: ${{ inputs.admin_emails == '' || steps.send.outcome == 'failure' }}
      shell: bash
      run: |
        if [[ -z "$ADMIN_EMAILS" ]]; then
          echo "::error ::MORPHOCLOUD_GITHUB_ADMIN_EMAILS is not set: the admin notification '$SUBJECT' was not sent"
        else
          echo "::error ::The admin notification '$SUBJECT' could not be sent (mail server error); flagged on issue #$ISSUE_NUMBER for the catch-up"
        fi
        gh issue edit "$ISSUE_NUMBER" --add-label "admin-email-failed" \
          || echo "::warning ::Could not add the admin-email-failed label to issue #$ISSUE_NUMBER"
        {
          printf '%s\n\n' "⚠️ The admin notification for this event could not be sent (mail server error at $(date -u +%Y-%m-%dT%H:%MZ)). It is re-sent automatically once mail works."
          printf 'Subject: %s\n\n' "$SUBJECT"
          cat /tmp/notify-admins-body.md
        } > /tmp/notify-admins-comment.md
        gh issue comment "$ISSUE_NUMBER" --body-file /tmp/notify-admins-comment.md \
          || echo "::warning ::Could not comment on issue #$ISSUE_NUMBER"
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        SUBJECT: ${{ inputs.subject }}
        ADMIN_EMAILS: ${{ inputs.admin_emails }}
