repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.33.2"
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/rhysd/actionlint
    rev: "v1.7.12"
    hooks:
      - id: actionlint
        # Disable actionlint's shellcheck integration. Our `run:` blocks trip dozens
        # of mostly-informational shellcheck findings (SC2086, SC2016, SC1090, SC2129,
        # …) that aren't worth re-quoting across production cron workflows. actionlint's
        # own workflow/expression checks still run. Vendorized, so Instances + course
        # repos inherit the same setting.
        args: ["-shellcheck="]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.3"
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: local
    hooks:
      # actionlint and check-github-actions both pass an action.yml carrying a
      # ${{ job.status }} in an input description, but the runner fails to load
      # it at every call site. That took down every IssueOps command once
      # already — see the script's docstring.
      - id: check-action-manifest-expressions
        name: No template expressions outside runs.steps in action manifests
        entry: python scripts/check-action-manifest-expressions.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^\.github/actions/.*/action\.ya?ml$
      # GitHub's on:schedule fires a few times a day whatever the cron says; the
      # runner's crontab is the clock, rendered from '# dispatch:' markers in the
      # workflows. Every time-driven workflow must carry one, and the committed
      # crontabs must match — see the script's docstring.
      - id: check-workflow-clock
        name: Time-driven workflows are registered with the runner clock
        entry: python scripts/check-workflow-clock.py check
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|scripts/.*\.crontab(\.extra)?|scripts/check-workflow-clock\.py)$
      # The incident harvester tells automation from a hand dispatch by a
      # DISPATCH line in a runner-side log (INCIDENT_STORE_PLAN.md, actor_kind
      # rule 1). Every runner-side `gh workflow run` call site must log one;
      # see the script's docstring. PR B extends it to the workflows.
      - id: check-dispatch-logging
        name: Runner-side dispatch call sites log a DISPATCH line
        entry: python scripts/check-dispatch-logging.py
        language: python
        files: ^scripts/.*\.(sh|py)$
        exclude: ^scripts/(test_.*\.py|check-dispatch-logging\.py)$
